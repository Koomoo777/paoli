<title>力量训练</title>
<style>
/* 布局思路：iOS 原生观感。系统字体与分组列表，纯黑/浅灰底，唯一强调色是系统绿；发力部位用系统橙。数字用圆体。 */
:root{
  --bg:#f2f2f7; --panel:#ffffff; --panel2:#e5e5ea; --ink:#000000; --mute:#8a8a8e; --line:rgba(60,60,67,.2);
  --accent:#34c759; --on-accent:#ffffff; --hot:#ff9500; --red:#ff3b30; --warn:#ff9500; --tint:#1f9d45;
  --body:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Helvetica Neue",sans-serif;
  --round:ui-rounded,"SF Pro Rounded",-apple-system,"PingFang SC",sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#000000; --panel:#1c1c1e; --panel2:#2c2c2e; --ink:#ffffff; --mute:#98989f; --line:rgba(84,84,88,.65);
  --accent:#30d158; --on-accent:#00210b; --hot:#ff9f0a; --red:#ff453a; --warn:#ff9f0a; --tint:#30d158; color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#000000; --panel:#1c1c1e; --panel2:#2c2c2e; --ink:#ffffff; --mute:#98989f; --line:rgba(84,84,88,.65);
  --accent:#30d158; --on-accent:#00210b; --hot:#ff9f0a; --red:#ff453a; --warn:#ff9f0a; --tint:#30d158; color-scheme:dark;}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
html,body{height:100%;margin:0}
html{min-height:calc(100% + env(safe-area-inset-top))}
body{background:var(--bg);color:var(--ink);font:17px/1.35 var(--body);overflow:hidden;overscroll-behavior:none;-webkit-font-smoothing:antialiased;-webkit-user-select:none;user-select:none}
input,textarea{-webkit-user-select:text;user-select:text}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
:focus-visible{outline:2px solid var(--tint);outline-offset:2px}
h1,h2,h3,p{margin:0}
h1,h2{text-wrap:balance}
h1{font-size:34px;line-height:1.2;font-weight:700;letter-spacing:.01em}
.num{font-family:var(--round);font-variant-numeric:tabular-nums}
.mute{color:var(--mute)} .small{font-size:13px;line-height:1.4}
[hidden]{display:none!important}

#shell{overflow:hidden;position:fixed;top:0;left:0;right:0;height:var(--H,100%);display:flex;flex-direction:column;max-width:560px;margin:0 auto}
.page{flex:1;overflow-y:auto;background:var(--bg);position:relative;z-index:1;-webkit-overflow-scrolling:touch;padding:calc(env(safe-area-inset-top) + 10px) 16px calc(env(safe-area-inset-bottom) + 28px);display:flex;flex-direction:column;gap:14px}

/* 导航行 */
.top{display:flex;justify-content:space-between;align-items:center;min-height:44px}
.top a{color:var(--tint);text-decoration:none;font-size:17px;display:inline-flex;align-items:center;gap:2px;min-height:44px}
.top svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.top .date{font-size:13px;font-weight:600;color:var(--mute)}
.top a.me{color:var(--mute);font-size:15px;gap:8px}
.top a.me i{width:30px;height:30px;border-radius:50%;background:var(--panel2);color:var(--ink);font:600 14px/30px var(--round);text-align:center;font-style:normal}
.head{display:flex;justify-content:space-between;align-items:center;gap:12px}

/* 主页 */
.center{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding-bottom:6vh}
.ringbtn{position:relative;width:216px;height:216px;margin-bottom:30px;transition:transform .18s ease}
.ringbtn:active{transform:scale(.96)}
.ringbtn svg{position:absolute;inset:0;width:100%;height:100%}
.ringbtn circle{fill:none;stroke:var(--accent);stroke-width:15}
.ringbtn .trk{opacity:.2} .ringbtn .arc{stroke-linecap:round}
.ringbtn .core{position:absolute;inset:31px;border-radius:50%;background:var(--accent);display:grid;place-items:center}
.ringbtn .core svg{position:static;width:56px;height:56px;fill:var(--on-accent);margin-left:6px}
.center h1{font-size:28px}
.center .sub{font-size:15px;color:var(--mute);margin-top:6px}
.center .hint{font-size:12px;line-height:1.5;color:var(--mute);max-width:250px;margin-top:14px;opacity:.85}
.center .wk-goal{font:600 13px var(--round);color:var(--mute);margin-top:22px;padding:6px 12px;border-radius:99px;background:var(--panel)}

/* 分组卡片与按钮 */
h3{font-size:13px;font-weight:400;color:var(--mute);padding:6px 16px 0}
.card h3{padding:0}
.card{background:var(--panel);border-radius:16px;padding:14px 16px;display:flex;flex-direction:column;gap:12px}
.row{display:flex;align-items:center;gap:12px}
.grow{flex:1;min-width:0}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:0 16px;border-radius:12px;background:var(--panel2);font-weight:600;font-size:17px;text-decoration:none;color:var(--ink);transition:opacity .15s}
.btn:active{opacity:.6}
.btn.go,.btn.ok{background:var(--accent);color:var(--on-accent)}
.btn.stop{background:var(--red);color:#fff}
.btn.tint{background:color-mix(in srgb,var(--tint) 16%,transparent);color:var(--tint)}
.btn.ghost{background:none;color:var(--tint);font-weight:400}
.btn.lg{min-height:54px;border-radius:16px}
.btn.sm{min-height:34px;padding:0 14px;font-size:15px;border-radius:99px}
.btn.wide{width:100%}
.btn[data-confirm]:not(.go):not(.ok){color:var(--red)}
.btn[data-armed],.btn[data-armed].go{background:var(--red);color:#fff}
.pill{display:inline-block;font-size:12px;font-weight:600;padding:3px 9px;border-radius:99px;background:var(--panel2);color:var(--mute);white-space:nowrap}
.pill.ok{background:color-mix(in srgb,var(--accent) 18%,transparent);color:var(--tint)}
.pill.wait{background:color-mix(in srgb,var(--warn) 18%,transparent);color:var(--warn)}
.pill.bad{background:color-mix(in srgb,var(--red) 16%,transparent);color:var(--red)}

.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.day{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;color:var(--mute)}
.day i{width:30px;height:30px;border-radius:50%;border:2.5px solid var(--panel2)}
.day.hit i{background:var(--accent);border-color:var(--accent)}
.day.today{color:var(--ink);font-weight:600}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stats div{display:flex;flex-direction:column;gap:2px}
.stats b{font:700 30px/1 var(--round)}

.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.tile{background:var(--panel);border-radius:16px;padding:12px 14px 14px;text-align:left;display:flex;flex-direction:column;gap:2px;position:relative;width:100%}
.sheet .tile{background:var(--panel2)}
.tile .no{position:absolute;left:12px;top:10px;font:600 13px var(--round);color:var(--mute)}
.tile b{font-size:16px;line-height:1.3;font-weight:600}
.fig{height:76px;width:auto;max-width:100%;align-self:center;display:block;flex:none}
.fig path,.fig ellipse{stroke:none}
.figbig{height:140px}
.thumb{width:84px;height:84px;border-radius:12px;object-fit:cover;align-self:center;flex:none}

/* 弹层 */
#sheet,#wk{position:fixed;top:0;left:0;right:0;height:var(--H,100%);display:none}
#sheet.on{display:flex;z-index:30;background:rgba(0,0,0,.4);align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:560px;max-height:92%;border-radius:20px 20px 0 0;display:flex;flex-direction:column}
.sheet::before{content:"";width:36px;height:5px;border-radius:3px;background:var(--panel2);align-self:center;margin-top:6px}
.sheet header{display:flex;align-items:center;gap:12px;padding:8px 16px 12px}
.sheet header h2{flex:1;font-size:20px;font-weight:700}
.sheet .body{overflow-y:auto;padding:4px 16px 16px;display:flex;flex-direction:column;gap:14px}
.sheet .body>*{flex:none}
.sheet .body>div:not(.grid):not(.row):not(.two):not(.stats){background:var(--panel);border-radius:16px;padding:0 16px}
.sheet footer{padding:10px 16px calc(12px + env(safe-area-inset-bottom));display:flex;gap:10px}
.sheet footer .btn{flex:1;min-height:50px;border-radius:14px}
.x{width:30px;height:30px;border-radius:50%;background:var(--panel2);font-size:14px;color:var(--mute);font-weight:700}
.cues{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:8px;font-size:16px;line-height:1.4}
.cues li::marker{color:var(--mute);font-family:var(--round);font-weight:600}
.cues.bad li::marker{color:var(--red)}
label.f{display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--mute)}
input[type=text],input[type=number],input[type=password],select,textarea{background:var(--panel);border:0;border-radius:12px;padding:11px 14px;color:var(--ink);width:100%;font-size:17px;-webkit-appearance:none;appearance:none}
.card input[type=text],.card input[type=number],.card input[type=password]{background:var(--bg)}
textarea{min-height:96px;resize:vertical}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.erow{display:flex;align-items:center;gap:8px;padding:9px 0;border-bottom:.5px solid var(--line)}
.erow:last-child{border-bottom:0}
.step{display:flex;align-items:center;gap:8px}
.step button{width:36px;height:32px;border-radius:8px;background:var(--panel2);font-weight:600;font-size:18px}
.step span{min-width:22px;text-align:center;font:600 18px var(--round)}
.hrow{display:flex;gap:12px;align-items:center;width:100%;text-align:left;padding:12px 0;border-bottom:.5px solid var(--line)}
.hrow:last-child{border-bottom:0}
.hrow .date{font:600 17px/1 var(--round);width:48px;color:var(--mute)}
.hrow b{font-weight:600}
.hrow::after{content:"›";color:var(--mute);font-size:20px;opacity:.6}
pre.log{margin:0;white-space:pre-wrap;font:16px/1.6 var(--body)}
ol.steps{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px;font-size:15px}
code{background:var(--panel2);padding:1px 6px;border-radius:6px;font-size:13px;word-break:break-all}
.note{font-size:13px;padding:10px 12px;border-radius:12px;background:color-mix(in srgb,var(--warn) 14%,transparent)}

/* 训练中：一次只看一个动作、一组 */
#wk.on{display:flex;z-index:20;background:var(--bg);justify-content:center}
.wk{width:100%;max-width:560px;display:flex;flex-direction:column;height:100%}
.bar{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:calc(env(safe-area-inset-top) + 4px) 8px 4px}
.bar>button{min-width:44px;min-height:44px;color:var(--tint);font-size:17px;justify-self:start;padding:0 8px;display:inline-flex;align-items:center}
.bar>button:last-child{justify-self:end}
.bar svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.bar [data-armed]{color:var(--red);font-weight:600}
.pager{display:flex;align-items:center;gap:2px;font:600 17px var(--round)}
.pager button{width:40px;height:44px;color:var(--tint);display:grid;place-items:center}
.pager button:disabled{opacity:.25}
.prog{height:3px;background:var(--panel2);margin:0 16px;border-radius:2px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--accent);border-radius:2px;transition:width .3s}
.wk .list{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:18px 16px 20px;display:flex;flex-direction:column;gap:14px}
.xhead{display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
.xhead h1{font-size:32px}
.xhead .clock{font:600 17px var(--round);color:var(--mute);padding-bottom:3px}
.dots{display:flex;gap:7px;align-items:center}
.dots i{width:9px;height:9px;border-radius:50%;background:var(--panel2)}
.dots i.on{background:var(--accent)} .dots i.cur{background:none;box-shadow:inset 0 0 0 2.5px var(--accent)}
.dots span{font-size:15px;color:var(--mute);margin-left:6px}
.hero{align-items:center;gap:10px;padding:16px 14px 18px}
.hero .fig{height:118px} .hero .thumb{width:118px;height:118px}
.heromain{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:2px}
.big{font:700 58px/1.05 var(--round);text-align:center;letter-spacing:-.01em}
.stepper{display:flex;align-items:center;gap:6px}
.stepper button{width:42px;height:42px;border-radius:50%;background:var(--panel2);font-size:24px;line-height:1;color:var(--tint);flex:none}
.stepper input.big{width:104px;padding:0;background:none!important;border-radius:0;font:700 58px/1.05 var(--round);text-align:center}
.unit{font-size:15px;color:var(--mute)}
.kg{display:flex;align-items:center;gap:6px;margin-top:6px;font-size:15px;color:var(--mute)}
.kg input{width:76px;padding:6px 8px;text-align:center;background:var(--bg)}
.tipc{gap:4px;border-left:4px solid var(--accent);border-radius:6px 16px 16px 6px}
.tipc b{font-size:19px;line-height:1.35;font-weight:600}
.cues.bad{list-style:none;padding-left:0;gap:12px}
.cues.bad li{padding-left:22px;position:relative}
.cues.bad li::before{content:"✕";position:absolute;left:0;top:1px;color:var(--red);font-weight:700;font-size:14px}
.cues.bad em{display:block;font-style:normal;color:var(--tint);margin-top:2px}
.bar .r{justify-self:end;display:flex;align-items:center}
.bar .r button{min-width:44px;min-height:44px;color:var(--tint);font-size:17px;padding:0 8px;display:inline-flex;align-items:center;justify-content:center;transition:transform .2s}
.bar .r button.holding{transform:scale(1.35)}
.holdbtn{background:linear-gradient(rgba(0,0,0,.35),rgba(0,0,0,.35)) no-repeat left/0% 100%,var(--red);transition:background-size .15s}
.holdbtn.holding{background-size:100% 100%;transition:background-size .9s linear}
body{-webkit-touch-callout:none}
.links{display:flex;justify-content:center;gap:24px;padding-top:4px}
.links button{font-size:15px;color:var(--tint);min-height:36px}
.links [data-confirm]{color:var(--red)}
.links [data-armed]{font-weight:600}
.wk footer{padding:10px 16px calc(12px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:10px;border-top:.5px solid var(--line);background:var(--bg)}
.wk .list.restonly{justify-content:center;padding-bottom:8vh}
.restbox{position:relative;width:260px;height:260px;align-self:center;margin:6px 0 2px;flex:none}
.restbox svg{width:100%;height:100%}
.restbox circle{fill:none;stroke:var(--accent);stroke-width:12;stroke-linecap:round}
.restbox .trk{stroke:var(--panel2)}
.restnum{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px}
.restnum .big{font-size:58px}
.restbox.prep .big{font-size:96px}
.restbox.prep circle.arc{stroke:var(--hot)}
.restnum .unit{font-size:15px}
.pager span{max-width:46vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.next{text-align:center;color:var(--mute)} .next b{color:var(--ink);font-weight:600}
.recall{font-size:20px;font-weight:700;padding:10px 4px 0}
.rest{display:none;align-items:center;gap:10px}
.rest.on{display:flex}
.rest .t{font:700 28px/1 var(--round);min-width:74px}

/* 第 12 版：统一整理 */
.top a.me{color:var(--mute);font-size:15px;font-weight:500}
.center{padding-bottom:2vh}
.ringbtn{width:208px;height:208px;margin-bottom:34px}
.center h1{font-size:30px}
.center .sub{font-size:17px;color:var(--mute);margin-top:6px}
.center .sub2{font:500 13px var(--round);color:var(--mute);opacity:.75;margin-top:14px;letter-spacing:.02em}
.footnote{font-size:12px;line-height:1.5;color:var(--mute);opacity:.8;text-align:center;max-width:270px;align-self:center}
h3{margin-top:6px;text-transform:none}
.card.list{padding:0 16px;gap:0}
.lrow{display:flex;align-items:center;gap:12px;min-height:50px;width:100%;text-align:left;font-size:17px;color:var(--ink);text-decoration:none;border-bottom:.5px solid var(--line)}
.lrow:last-child{border-bottom:0}
.lrow:not(.nochev)::after{content:"›";color:var(--mute);font-size:20px;opacity:.6}
.lrow .step span{min-width:54px;font-size:17px}
.foot{font-size:13px;line-height:1.45;color:var(--mute);padding:0 16px;margin-top:-6px}
.day i{width:26px;height:26px;border-width:2px}
.stats b{font-size:28px}
.pager button{color:var(--mute)}
.bar .r [data-act="w-finish"]{color:var(--red)}
.xhead h1{font-size:32px;letter-spacing:0}
.dots .clock{font:600 15px var(--round);color:var(--mute);margin-left:8px}
.tipc{border:0;border-radius:16px;background:color-mix(in srgb,var(--accent) 15%,var(--panel));gap:2px}
.tipc .small{color:var(--tint)}
.tipc b{font-size:18px}
.cues{font-size:16px}
.wk .list{gap:12px}
.sw{width:51px;height:31px;border-radius:16px;background:var(--panel2);position:relative;transition:background .2s;flex:none}
.sw i{position:absolute;left:2px;top:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:transform .2s}
.sw.on{background:var(--accent)} .sw.on i{transform:translateX(20px)}
.bar .clock{justify-self:start;padding-left:10px;font:600 17px var(--round);color:var(--mute)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{min-width:46px;height:36px;padding:0 10px;border-radius:10px;background:var(--panel);font:600 16px var(--round);color:var(--mute)}
.chip:disabled{opacity:.45}
.chip.on{background:color-mix(in srgb,var(--accent) 20%,var(--panel));color:var(--tint)}
.chip.cur{box-shadow:inset 0 0 0 2px var(--accent);color:var(--ink)}
.last{font-size:14px;color:var(--mute);padding:0 2px;margin-top:-4px}
.erow.rec{align-items:baseline;gap:14px}.erow.rec .vals{text-align:right;color:var(--ink)}.erow.rec small{color:var(--mute);font-size:12px}
.pgdots{display:flex;gap:9px;align-items:center;justify-content:center;margin-top:26px;min-height:24px}
.pgdots button{width:8px;height:8px;border-radius:50%;background:var(--panel2);padding:0;position:relative}
.pgdots button::after{content:"";position:absolute;inset:-12px -5px}
.pgdots button.on{background:var(--ink)}
.pgdots .add{width:auto;height:auto;background:none;color:var(--panel2);font:700 15px/1 var(--round)}
.pgdots .add.on{background:none;color:var(--ink)}
.ringbtn.plus .core{background:var(--panel2)} .ringbtn.plus .core svg{margin-left:0;width:60px;height:60px} .ringbtn.plus .core svg path{stroke:var(--ink)!important}
.ringbtn.plus .trk{stroke:var(--panel2);opacity:1}
/* ===== 第 19 版：交互与动效，按 iOS 的习惯来 ===== */
:root{--ease:cubic-bezier(.32,.72,0,1);--glass:color-mix(in srgb,var(--panel) 76%,transparent);--r:20px}
.card,.tile{border-radius:var(--r)}
.hero{border-radius:26px}
.btn.lg,.sheet footer .btn{border-radius:999px;min-height:52px}
.btn{border-radius:14px}
.btn:active,.lrow:active,.hrow:active,.tile:active,.chip:active{opacity:.55}
.lrow,.hrow,.tile,.chip{transition:opacity .15s}
/* 导航：返回和设置是悬浮的圆形玻璃按钮 */
.top{min-height:48px}
.top a:not(.me){width:44px;height:44px;border-radius:50%;justify-content:center;font-size:0;gap:0;color:var(--ink);background:var(--glass);-webkit-backdrop-filter:blur(20px) saturate(1.8);backdrop-filter:blur(20px) saturate(1.8);box-shadow:inset 0 0 0 .5px color-mix(in srgb,var(--ink) 12%,transparent)}
.top a:not(.me):active{transform:scale(.92)}
.top a.me{min-height:44px;padding:0 4px}
.bar .r{background:var(--glass);-webkit-backdrop-filter:blur(20px) saturate(1.8);backdrop-filter:blur(20px) saturate(1.8);border-radius:999px;padding:0 6px;margin-right:6px;box-shadow:inset 0 0 0 .5px color-mix(in srgb,var(--ink) 12%,transparent)}
.bar .r button{min-height:40px}
/* 页面切换：新页面从右推入，返回时旧页面向右滑出 */
.pgghost{position:absolute;inset:0;z-index:0;pointer-events:none}
.pushIn{animation:pushIn .42s var(--ease) both}.pushOut{animation:pushOut .42s var(--ease) both}
.popIn{animation:popIn .42s var(--ease) both}.pgghost.popOut{z-index:2;animation:popOut .42s var(--ease) both}
@keyframes pushIn{from{transform:translateX(100%)}to{transform:none}}
@keyframes pushOut{from{transform:none;opacity:1}to{transform:translateX(-28%);opacity:.4}}
@keyframes popIn{from{transform:translateX(-28%);opacity:.4}to{transform:none;opacity:1}}
@keyframes popOut{from{transform:none}to{transform:translateX(100%)}}
/* 主页分页 */
.hpager{flex:1;display:flex;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch;margin:0 -16px;scrollbar-width:none;overscroll-behavior-x:contain}
.hpager::-webkit-scrollbar{display:none}
.hpage{flex:0 0 100%;scroll-snap-align:center;scroll-snap-stop:always;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:0 16px}
.hpage h1{font-size:30px}.hpage .sub{font-size:17px;color:var(--mute);margin-top:6px}.hpage .sub2{font:500 13px var(--round);color:var(--mute);opacity:.75;margin-top:14px;letter-spacing:.02em}
.pgdots{margin:0 0 18px;min-height:28px}
.pgdots button{transition:background .2s,transform .2s}.pgdots button.on{transform:scale(1.15)}
/* 面板：从底部升起，四周留边，可下拉关闭 */
#sheet.on{background:rgba(0,0,0,.42);padding:0 8px calc(8px + env(safe-area-inset-bottom)*.5)}
.sheet{border-radius:34px;max-height:calc(100% - env(safe-area-inset-top) - 20px);overflow:hidden;transition:transform .34s var(--ease);background:color-mix(in srgb,var(--bg) 92%,var(--panel))}
.sheet::before{display:none}
.grab{display:flex;justify-content:center;padding:8px 0 2px;touch-action:none}.grab i{width:36px;height:5px;border-radius:3px;background:color-mix(in srgb,var(--ink) 22%,transparent)}
.sheet header{padding:6px 16px 12px;touch-action:none}
.sheet footer{padding:10px 16px 16px}
.sheetIn{animation:sheetIn .44s var(--ease) both}.dimIn{animation:dimIn .3s ease both}
#sheet.out{animation:dimOut .3s ease both;pointer-events:none}#sheet.out .sheet{animation:sheetOut .3s var(--ease) both}
@keyframes sheetIn{from{transform:translateY(105%)}to{transform:none}}
@keyframes sheetOut{to{transform:translateY(105%)}}
@keyframes dimIn{from{background-color:rgba(0,0,0,0)}}@keyframes dimOut{to{background-color:rgba(0,0,0,0)}}
.fadeIn{animation:fadeIn .28s ease both}@keyframes fadeIn{from{opacity:0;transform:scale(.985)}to{opacity:1;transform:none}}
/* 操作表 */
.sheet.bare{background:none;overflow:visible;gap:8px;border-radius:0}
.askcard{background:color-mix(in srgb,var(--panel) 94%,transparent);-webkit-backdrop-filter:blur(30px);backdrop-filter:blur(30px);border-radius:26px;overflow:hidden;text-align:center}
.askcard p{font-size:13px;color:var(--mute);padding:16px 20px 14px;border-bottom:.5px solid var(--line)}
.askcard button,.askcancel{display:block;width:100%;min-height:58px;font-size:20px;color:var(--tint)}
.askcard button.red{color:var(--red)}
.askcancel{background:var(--panel);border-radius:26px;font-weight:600}
.askcard button:active,.askcancel:active{background:var(--panel2)}
/* 训练：整屏从底部升起；换动作左右滑入；休息和计时淡入 */
#wk.on{will-change:transform}
.coverIn{animation:coverIn .5s var(--ease) both}#wk.out{animation:coverOut .38s var(--ease) both;pointer-events:none}
@keyframes coverIn{from{transform:translateY(100%)}to{transform:none}}@keyframes coverOut{to{transform:translateY(100%)}}
.slideL{animation:slideL .36s var(--ease) both}.slideR{animation:slideR .36s var(--ease) both}
@keyframes slideL{from{transform:translateX(42%);opacity:0}to{transform:none;opacity:1}}
@keyframes slideR{from{transform:translateX(-42%);opacity:0}to{transform:none;opacity:1}}
/* 主按钮浮在内容上，内容从它下面淡出，不再用一条硬线隔开 */
.wk{position:relative}
.wk .list{padding-bottom:calc(env(safe-area-inset-bottom) + 108px)}
.wk footer{position:absolute;left:0;right:0;bottom:0;border-top:0;background:linear-gradient(to top,var(--bg) 58%,transparent);padding-top:34px;pointer-events:none}
.wk footer>*{pointer-events:auto}
.wk footer .btn.go{box-shadow:0 6px 22px color-mix(in srgb,var(--accent) 30%,transparent)}
.chip{border-radius:12px;min-width:48px;height:40px;transition:background .2s,color .2s,box-shadow .2s,opacity .15s}
.stepper button{width:46px;height:46px;transition:transform .12s,background .12s}.stepper button:active{transform:scale(.9);background:color-mix(in srgb,var(--tint) 22%,var(--panel2))}
.prog i{transition:width .5s var(--ease)}
.ringbtn{transition:transform .25s var(--ease)}.ringbtn:active{transform:scale(.94)}
.sw,.sw i{transition-timing-function:var(--ease);transition-duration:.28s}
@media (prefers-reduced-motion:reduce){.pushIn,.pushOut,.popIn,.pgghost.popOut,.sheetIn,.coverIn,.slideL,.slideR,.fadeIn,#wk.out,#sheet.out .sheet{animation-duration:.01s!important}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
/* ===== 第 21 版：训练页一屏放下；组数竖排在左并带上次的数值；肌肉示意图 ===== */
.fig .sil{fill:color-mix(in srgb,var(--ink) 11%,var(--panel))}
.fig .m{fill:color-mix(in srgb,var(--ink) 19%,var(--panel))}
.fig .m.s{fill:color-mix(in srgb,var(--hot) 42%,var(--panel))}
.fig .m.p{fill:var(--hot)}
.figbig{height:200px}
.tile .fig{height:96px}
section.f{display:flex;flex-direction:column;gap:8px;font-size:13px;color:var(--mute)}
.wk .list{padding:calc(12px*var(--k,1)) 16px calc(env(safe-area-inset-bottom) + 80px);gap:calc(10px*var(--k,1))}
.wk .list>*{flex:none}
.xhead h1{font-size:calc(28px*var(--k,1))}
.wk .list>.hero{flex:1 1 0;min-height:calc(236px*var(--k,1));max-height:400px;flex-direction:row;align-items:stretch;gap:12px;padding:12px}
.hero .chips{flex:none;width:62px;flex-direction:column;flex-wrap:nowrap;gap:6px}
.hero .chip{flex:1 1 0;min-height:0;max-height:54px;min-width:0;width:100%;height:auto;padding:0;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px}
.hero .chip:disabled{opacity:.6}
.hero .chip.on{background:color-mix(in srgb,var(--accent) 18%,var(--panel))}
.chip b{font:700 18px/1 var(--round)}
.chip small{font:500 10.5px/1 var(--body);color:var(--mute);white-space:nowrap}
.heromain{min-height:0;justify-content:center;gap:0}
.hero .fig{flex:1 1 0;min-height:0;height:auto;width:100%;margin-bottom:6px}
.hero .thumb{width:104px;height:104px;margin-bottom:6px}
.hero .big,.hero .stepper input.big{font-size:calc(50px*var(--k,1))}
.hero .stepper input.big{width:96px}
.hero .unit{font-size:14px}
.hero .links{padding:0}.hero .links button{min-height:30px;font-size:14px}
.wk .list>.card:not(.hero){padding:calc(12px*var(--k,1)) 14px}
.wk .cues{font-size:calc(15px*var(--k,1));line-height:1.36;gap:calc(6px*var(--k,1))}
.wk .cues.bad{gap:calc(9px*var(--k,1))}
.wk .tipc b{font-size:calc(16px*var(--k,1))}
.wk .card p{font-size:calc(15px*var(--k,1))}
.restbox{flex:1 1 0!important;min-height:150px;max-height:260px;width:auto;height:auto;align-self:stretch;margin:0;container-type:size}
.restbox svg{position:absolute;inset:0}
.restnum{gap:clamp(2px,3cqmin,10px)}
.restnum .big{font-size:clamp(34px,22cqmin,58px)}
.restbox.prep .big{font-size:clamp(56px,37cqmin,96px)}
.mups{display:flex;flex-wrap:wrap;gap:8px}
.mups button{min-height:34px;padding:0 12px;border-radius:99px;background:var(--panel);font-size:15px;color:var(--ink)}
.mups button.on{background:var(--hot);color:#fff}
[hidden]{display:none!important}

/* ---------- 工具 ---------- */
const $=s=>document.querySelector(s);
const h=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const exById=id=>S.exercises.find(e=>e.id===id);
const pad=n=>String(n).padStart(2,'0');
const mmss=sec=>{sec=Math.max(0,Math.round(sec));return pad(Math.floor(sec/60))+':'+pad(sec%60)};
const dur=sec=>{const m=Math.round(sec/60);return m<60?m+' 分钟':Math.floor(m/60)+' 小时 '+(m%60)+' 分'};
const dayKey=t=>{const d=new Date(t);return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())};
function fig(ex,cls){
  if(ex&&ex.img)return `<img class="thumb ${cls||''}" src="${ex.img}" alt="">`;
  return muscles(muOf(ex),cls,ex?h(ex.name)+'发力部位':'');
}
function teachDo(e){ // 做动作时看：步骤，最后用一句话收尾
  return (e.cues&&e.cues.length?`<section class="card"><ol class="cues">${e.cues.map(c=>`<li>${h(c)}</li>`).join('')}</ol></section>`:'')
    +(e.tip?`<section class="card tipc"><b>${h(e.tip)}</b></section>`:'');
}
function teachCheck(e,bare){ // 做完后回想：感觉对不对，有没有犯常见错误
  const bad=(e.bad||[]).map(x=>{const q=String(x).split('→');return `<li>${h(q[0].trim())}${q[1]?`<em>改：${h(q.slice(1).join('→').trim())}</em>`:''}</li>`}).join('');
  return (e.feel?`${bare?'':'<h3>做对了的感觉</h3>'}<section class="card"><p>${h(e.feel)}</p></section>`:'')
    +(bad?`${bare?'':'<h3>常见错误和改法</h3>'}<section class="card"><ul class="cues bad">${bad}</ul></section>`:'');
}
const teach=e=>teachDo(e)+teachCheck(e);
function lastOf(exId){ // 这个动作上一次训练里完成的各组数值
  for(const s of S.sessions){const it=s.items.find(x=>x.exId===exId&&x.sets.some(y=>y.done));if(it)return it.sets.filter(y=>y.done).map(y=>y.val)}
  return null;
}
function logText(s){
  const lines=s.items.map(it=>{const dn=it.sets.filter(x=>x.done);if(!dn.length)return null;
    const v=dn.map(x=>x.val+(x.w?'×'+x.w+'kg':''));const same=v.every(a=>a===v[0]);
    return it.name+'  '+(same?dn.length+' 组 × '+v[0]:v.join(' / '))+' '+it.unit}).filter(Boolean);
  return lines.join('\n');
}
function weekInfo(){
  const now=new Date(),mon=new Date(now.getFullYear(),now.getMonth(),now.getDate()-((now.getDay()+6)%7));
  const days=new Set(S.sessions.map(s=>dayKey(s.start)));
  const wk=[...'一二三四五六日'].map((n,i)=>{const d=new Date(mon);d.setDate(mon.getDate()+i);return{n,hit:days.has(dayKey(d)),today:dayKey(d)===dayKey(now)}});
  const weekOf=t=>{const d=new Date(t);const m=new Date(d.getFullYear(),d.getMonth(),d.getDate()-((d.getDay()+6)%7));return Math.round(m.getTime()/864e5/7)};
  const weeks=new Set(S.sessions.map(s=>weekOf(s.start)));let cur=weekOf(now),streak=0;
  if(!weeks.has(cur))cur--;while(weeks.has(cur)){streak++;cur--}
  return{wk,streak,count:wk.filter(d=>d.hit).length};
}

/* ---------- 页面 ---------- */
function route(){const r=location.hash.slice(1);return['home','me','prefs','moves'].includes(r)?r:'home'}
function anim(el,cls){if(!el)return;el.classList.remove(cls);void el.offsetWidth;el.classList.add(cls);el.addEventListener('animationend',()=>el.classList.remove(cls),{once:true})}
let hz;
function haptic(){ // iPhone 上切换系统开关会有一下轻震，借它给关键操作一点触感；不支持的设备上什么都不发生
  try{if(!hz){hz=document.createElement('label');hz.setAttribute('aria-hidden','true');hz.style.cssText='position:fixed;left:-99px;top:-99px;opacity:0;pointer-events:none';hz.innerHTML='<input type="checkbox" switch tabindex="-1">';document.body.appendChild(hz)}hz.click()}catch(e){}
}
function wireHome(){ // 主页的项目是真正的横向分页，页码点跟着滚动走
  const hp=$('#hp');if(!hp)return;hp.scrollLeft=curIdx()*hp.clientWidth;
  hp.addEventListener('scroll',()=>{const k=Math.round(hp.scrollLeft/(hp.clientWidth||1));if(k===curIdx())return;S.cur=k;save();haptic();
    document.querySelectorAll('.pgdots button').forEach((d,q)=>d.classList.toggle('on',q===k))},{passive:true});
}
function render(){
  const r=route(),app=$('#app'),same=ui.k0===r,top=app.scrollTop;
  app.dataset.r=r;app.innerHTML=({home:vHome,me:vMe,prefs:vSettings,moves:vMoves})[r]();
  if(same)app.scrollTop=top;ui.k0=r;
  if(r==='home')wireHome();
  renderWk();renderSheet();
}

function curItem(){const a=S.active;if(a.cur==null||!a.items[a.cur])a.cur=0;return a.items[a.cur]}

}

function renderWk(){
  const el=$('#wk'),a=S.active,on=!!(a&&ui.wk),prev=ui.pw||'',pl=el.querySelector('.list'),top=pl?pl.scrollTop:0;
  const key=on?(T&&T.kind==='rest'&&!allDone()?'rest':T&&T.kind==='hold'&&T.i===a.cur?'hold':'ex'+a.cur):'';
  if(!on){ui.pw='';if(!prev){el.classList.remove('on','out');el.innerHTML='';return}
    const tok=ui.wTok=(ui.wTok||0)+1;el.classList.add('out');setTimeout(()=>{if(ui.wTok!==tok)return;el.classList.remove('on','out');el.innerHTML=''},380);return}

  const chips=it.sets.map((x,k)=>{const l=it.last&&it.last[k]!=null?it.last[k]:null;return `<button class="chip${x.done?' on':''}${k===vj?' cur':''}" data-act="ed" data-j="${k}" ${x.done||k===j?'':'disabled'} aria-label="第 ${k+1} 组${x.done?'，已完成 '+x.val+'，点按修改':''}${l!=null?'，上次 '+l:''}"><b>${x.done?h(x.val):k+1}</b>${l!=null?`<small>上次 ${h(l)}</small>`:''}</button>`}).join('');
  el.innerHTML=`<div class="wk"><header class="bar"><span class="clock num" id="clock">00:00</span>
    <div class="pager"><button data-act="w-go" data-d="-1" ${i?'':'disabled'} aria-label="上一个动作"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></button><span>${i+1} / ${n}</span><button data-act="w-go" data-d="1" ${i<n-1?'':'disabled'} aria-label="下一个动作"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg></button></div>
    <div class="r"><button data-act="w-pause" data-hold="w-askdrop" aria-label="${a.pAt?'继续训练':'暂停，长按可放弃训练'}">${a.pAt?`<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5.5v13l11-6.5z"/></svg>`:`<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6v12M15 6v12" stroke-width="2.8"/></svg>`}</button><button data-act="w-finish" data-confirm="结束这次训练？|结束训练">结束</button></div></header>
  <div class="prog"><i style="width:${tot?dn/tot*100:0}%"></i></div>

const elapsed=a=>((a.pAt||Date.now())-a.start-(a.pz||0))/1000;
function fitWk(){ // 一屏放下：图和圆环先让出高度，还放不下就把文字整体缩一点

}

  if(T&&T.kind==='hold'){

async function tokenReq(p){
  const c=S.settings.strava;let r;
  try{r=await fetch(ST+'/oauth/token',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:new URLSearchParams({client_id:c.clientId,client_secret:c.clientSecret,...p})})}
  catch(e){throw new Error('连不上 Strava，请检查网络')}
  if(!r.ok)throw new Error('Strava 拒绝了授权（'+r.status+'），请核对 Client ID 和 Secret');
  const j=await r.json();c.tok={a:j.access_token,r:j.refresh_token,e:j.expires_at};if(j.athlete)c.athlete=j.athlete.firstname||'';save();

async function api(path,opt){
  const c=S.settings.strava;if(!c.tok)throw new Error('尚未连接 Strava');
  if(c.tok.e<Date.now()/1000+120)await tokenReq({grant_type:'refresh_token',refresh_token:c.tok.r});
  opt=opt||{};let r;
  try{r=await fetch(ST+'/api/v3'+path,{method:opt.method||'GET',body:opt.body,headers:{Authorization:'Bearer '+c.tok.a,...(opt.type?{'Content-Type':opt.type}:{})}})}
  catch(e){throw new Error('连不上 Strava，请检查网络')}
  if(r.status===401)throw new Error('Strava 授权已失效，请在设置里重新授权');
  if(r.status===429)throw new Error('Strava 请求太频繁，稍后再试');

  return r.json();

if(S.active){ui.wk=true;keepAwake()} // 训练没结束就一直停在训练里
render();
(function(){
  let q;try{q=new URLSearchParams(location.search)}catch(e){return}
  const code=q.get('code'),err=q.get('error');
  if(code||err){try{history.replaceState(null,'',location.pathname+'#prefs')}catch(e){}
    if(code)finishAuth(code);else{ui.msg='你在 Strava 取消了授权。';render()}}
  else retryPending();
})();
if('serviceWorker' in navigator&&location.protocol==='https:'){try{navigator.serviceWorker.register('sw.js').catch(()=>{})}catch(e){}}
</script>
</body>
