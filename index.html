<style>
/* 布局思路：单列手机应用。跑道红只用于“正在做/要做”的东西，完成用草地绿，数字用计分牌字体。 */
:root{
  --bg:#eef0ec; --panel:#ffffff; --panel2:#e3e6e0; --ink:#161b20; --mute:#667078; --line:#d3d8d0;
  --track:#d2432a; --track-ink:#ffffff; --done:#23855a; --warn:#b26a00;
  --display:"Barlow Condensed","DIN Condensed","Arial Narrow",sans-serif;
  --body:-apple-system,"PingFang SC","Helvetica Neue","Microsoft YaHei",sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f1317; --panel:#1a2027; --panel2:#252d36; --ink:#eef1f3; --mute:#93a0ab; --line:#2e3741;
  --track:#ff6a4d; --track-ink:#1a0d08; --done:#4cc38a; --warn:#f0b24a; color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#0f1317; --panel:#1a2027; --panel2:#252d36; --ink:#eef1f3; --mute:#93a0ab; --line:#2e3741;
  --track:#ff6a4d; --track-ink:#1a0d08; --done:#4cc38a; --warn:#f0b24a; color-scheme:dark;}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.5 var(--body);overscroll-behavior:none}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
:focus-visible{outline:2px solid var(--track);outline-offset:2px}
h1,h2,h3,p{margin:0}
h1,h2,h3{text-wrap:balance}
.num{font-family:var(--display);font-variant-numeric:tabular-nums;letter-spacing:.01em}
.mute{color:var(--mute)} .small{font-size:13px}

#shell{height:100%;display:flex;flex-direction:column;max-width:560px;margin:0 auto}
#app{flex:1;overflow-y:auto;padding:calc(env(safe-area-inset-top) + 18px) 16px 24px;display:flex;flex-direction:column;gap:16px}
nav{display:grid;grid-template-columns:repeat(4,1fr);background:var(--panel);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav a{padding:12px 0 10px;text-align:center;text-decoration:none;color:var(--mute);font-size:14px;font-weight:600;border-top:3px solid transparent;margin-top:-1px}
nav a.on{color:var(--ink);border-top-color:var(--track)}

.head{display:flex;justify-content:space-between;align-items:end;gap:12px}
.head h1{font-size:26px;line-height:1.2}
.card{background:var(--panel);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:12px}
.row{display:flex;align-items:center;gap:12px}
.grow{flex:1;min-width:0}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:0 16px;border-radius:10px;background:var(--panel2);font-weight:600;text-decoration:none;color:var(--ink)}
.btn.go{background:var(--track);color:var(--track-ink)}
.btn.ok{background:var(--done);color:#fff}
.btn.ghost{background:none;border:1px solid var(--line)}
.btn.sm{min-height:36px;padding:0 12px;font-size:14px}
.btn.wide{width:100%}
.btn[data-armed]{background:var(--warn);color:#fff}
.pill{display:inline-block;font-size:12px;font-weight:600;padding:2px 8px;border-radius:99px;background:var(--panel2);color:var(--mute);white-space:nowrap}
.pill.ok{background:color-mix(in srgb,var(--done) 18%,transparent);color:var(--done)}
.pill.wait{background:color-mix(in srgb,var(--warn) 18%,transparent);color:var(--warn)}
.pill.bad{background:color-mix(in srgb,var(--track) 18%,transparent);color:var(--track)}

/* 本周 */
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.day{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px;color:var(--mute)}
.day i{width:100%;height:8px;border-radius:4px;background:var(--panel2)}
.day.hit i{background:var(--done)} .day.today{color:var(--ink);font-weight:700}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stats div{display:flex;flex-direction:column}
.stats b{font:600 30px/1 var(--display)}

/* 动作格子 */
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.tile{background:var(--panel);border-radius:14px;padding:10px 12px 12px;text-align:left;display:flex;flex-direction:column;gap:4px;position:relative;width:100%}
.sheet .tile{background:var(--panel2)}
.tile .no{position:absolute;left:10px;top:8px;font:600 15px var(--display);color:var(--mute)}
.fig{width:84px;height:84px;align-self:center;display:block}
.fig .b{stroke:var(--ink);fill:none;stroke-width:4.5;stroke-linecap:round;stroke-linejoin:round}
.fig .h{stroke:var(--track)} .fig .p{stroke:var(--mute);stroke-width:2.5;opacity:.7}
.fig .d{stroke-dasharray:4 4;stroke:var(--track);stroke-width:3}
.fig circle{fill:var(--ink)}
.figbig{width:150px;height:150px}
.thumb{width:84px;height:84px;border-radius:10px;object-fit:cover;align-self:center}
.tile b{font-size:16px;line-height:1.3}

/* 弹层 */
#sheet,#wk{position:fixed;inset:0;display:none}
#sheet.on{display:flex;z-index:30;background:rgba(0,0,0,.45);align-items:flex-end;justify-content:center}
.sheet{background:var(--panel);width:100%;max-width:560px;max-height:92%;border-radius:18px 18px 0 0;display:flex;flex-direction:column}
.sheet header{display:flex;align-items:center;gap:12px;padding:14px 16px;border-bottom:1px solid var(--line)}
.sheet header h2{flex:1;font-size:19px}
.sheet .body{overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:14px}
.sheet footer{padding:12px 16px calc(12px + env(safe-area-inset-bottom));display:flex;gap:10px;border-top:1px solid var(--line)}
.sheet footer .btn{flex:1}
.x{width:36px;height:36px;border-radius:50%;background:var(--panel2);font-size:18px}
.cues{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
.cues.bad li::marker{color:var(--track)}
h3{font-size:13px;color:var(--mute);font-weight:600;letter-spacing:.06em}
label.f{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--mute)}
input[type=text],input[type=number],input[type=password],select,textarea{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;color:var(--ink);width:100%;font-size:16px}
textarea{min-height:92px;resize:vertical}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.erow{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--line)}
.erow:last-child{border-bottom:0}
.step{display:flex;align-items:center;gap:6px}
.step button{width:34px;height:34px;border-radius:8px;background:var(--panel2);font-weight:700}
.step span{min-width:22px;text-align:center;font:600 20px var(--display)}

/* 训练中 */
#wk.on{display:flex;z-index:20;background:var(--bg);justify-content:center}
.wk{width:100%;max-width:560px;display:flex;flex-direction:column;height:100%}
.wk header{padding:calc(env(safe-area-inset-top) + 12px) 16px 12px;display:flex;align-items:center;gap:12px;background:var(--panel);border-bottom:1px solid var(--line)}
.wk header .clock{font:700 34px/1 var(--display)}
.wk .list{flex:1;overflow-y:auto;padding:14px 16px;display:flex;flex-direction:column;gap:12px}
.xc{background:var(--panel);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:8px;border-left:4px solid var(--line)}
.xc.cur{border-left-color:var(--track)} .xc.fin{border-left-color:var(--done)}
.xc .fig{width:52px;height:52px} .xc .thumb{width:52px;height:52px}
.set{display:grid;grid-template-columns:26px 1fr auto auto;align-items:center;gap:8px}
.set .n{font:600 18px var(--display);color:var(--mute)}
.set .in{display:flex;align-items:center;gap:6px}
.set input{width:68px;padding:8px;text-align:center;font:600 20px var(--display)}
.set.done input{border-color:transparent;background:transparent}
.chk{width:44px;height:40px;border-radius:10px;background:var(--panel2);font-weight:700;color:var(--mute)}
.set.done .chk{background:var(--done);color:#fff}
.hold{height:40px;padding:0 10px;border-radius:10px;background:var(--panel2);font-size:14px;font-weight:600}
#tbar{display:none;align-items:center;gap:12px;padding:10px 16px;background:var(--ink);color:var(--bg)}
#tbar.on{display:flex}
#tbar .t{font:700 34px/1 var(--display);min-width:84px}
#tbar .btn{background:rgba(127,127,127,.3);color:inherit}
.wk footer{padding:10px 16px calc(10px + env(safe-area-inset-bottom));display:flex;gap:10px;background:var(--panel);border-top:1px solid var(--line)}
.wk footer .btn{flex:1}
.resume{background:var(--track);color:var(--track-ink);border-radius:14px;padding:12px 16px;display:flex;align-items:center;gap:12px;width:100%;text-align:left;font-weight:600}
.hrow{display:flex;gap:12px;align-items:center;width:100%;text-align:left;padding:12px 0;border-bottom:1px solid var(--line)}
.hrow:last-child{border-bottom:0}
.hrow .date{font:600 22px/1 var(--display);width:54px}
pre.log{margin:0;white-space:pre-wrap;font:14px/1.6 var(--body)}
ol.steps{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px;font-size:14px}
code{background:var(--panel2);padding:1px 6px;border-radius:6px;font-size:13px;word-break:break-all}
.note{font-size:13px;padding:10px 12px;border-radius:10px;background:color-mix(in srgb,var(--warn) 14%,transparent)}
@media (prefers-reduced-motion:no-preference){.btn,.chk{transition:background .15s}}
</style>
</head>

/* ---------- 工具 ---------- */
const $=s=>document.querySelector(s);
const h=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const exById=id=>S.exercises.find(e=>e.id===id);
const pad=n=>String(n).padStart(2,'0');
const mmss=sec=>{sec=Math.max(0,Math.round(sec));return pad(Math.floor(sec/60))+':'+pad(sec%60)};
const dur=sec=>{const m=Math.round(sec/60);return m<60?m+' 分钟':Math.floor(m/60)+' 小时 '+(m%60)+' 分'};
const dayKey=t=>{const d=new Date(t);return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())};
function fig(ex,cls){
  if(ex&&ex.img)return `<img class="thumb ${cls||''}" src="${ex.img}" alt="">`;
  const d=ex&&DG[ex.dg];
  if(!d)return `<svg class="fig ${cls||''}" viewBox="0 0 100 100" aria-hidden="true"><polyline class="b p" points="6,90 94,90"/><polyline class="b p" points="30,50 70,50"/><polyline class="b p" points="50,30 50,70"/></svg>`;
  const pl=(a,c)=>(a||[]).map(p=>`<polyline class="b ${c}" points="${p}"/>`).join('');
  return `<svg class="fig ${cls||''}" viewBox="0 0 100 100" role="img" aria-label="${h(ex.name)}示意图"><polyline class="b p" points="6,90 94,90"/>${pl(d.p,'p')}${pl(d.b,'')}${pl(d.h,'h')}${pl(d.d,'d')}<circle cx="${d.head[0]}" cy="${d.head[1]}" r="6.5"/></svg>`;
}
function logText(s){
  const lines=s.items.map(it=>{const dn=it.sets.filter(x=>x.done);if(!dn.length)return null;
    const v=dn.map(x=>x.val+(x.w?'×'+x.w+'kg':''));const same=v.every(a=>a===v[0]);
    return it.name+'  '+(same?dn.length+' 组 × '+v[0]:v.join(' / '))+' '+it.unit}).filter(Boolean);
  return lines.join('\n');
}
function weekInfo(){
  const now=new Date(),mon=new Date(now.getFullYear(),now.getMonth(),now.getDate()-((now.getDay()+6)%7));
  const days=new Set(S.sessions.map(s=>dayKey(s.start)));
  const wk=[...'一二三四五六日'].map((n,i)=>{const d=new Date(mon);d.setDate(mon.getDate()+i);return{n,hit:days.has(dayKey(d)),today:dayKey(d)===dayKey(now)}});
  const weekOf=t=>{const d=new Date(t);const m=new Date(d.getFullYear(),d.getMonth(),d.getDate()-((d.getDay()+6)%7));return Math.round(m.getTime()/864e5/7)};
  const weeks=new Set(S.sessions.map(s=>weekOf(s.start)));let cur=weekOf(now),streak=0;
  if(!weeks.has(cur))cur--;while(weeks.has(cur)){streak++;cur--}
  return{wk,streak,count:wk.filter(d=>d.hit).length};
}

  <div class="list">${a.items.map((it,i)=>{const e=exById(it.exId),fin=it.sets.every(x=>x.done);let cls=fin?'fin':'';if(!fin&&!curFound){cls='cur';curFound=true}
    return `<section class="xc ${cls}"><div class="row">${fig(e||{})}<div class="grow"><b>${h(it.name)}</b><div class="mute small">目标 ${it.target} ${h(it.unit)}</div></div><button class="btn sm" data-act="open-ex" data-id="${it.exId}">要点</button></div>
    ${it.sets.map((st,j)=>`<div class="set${st.done?' done':''}"><span class="n">${j+1}</span><div class="in"><input id="v-${i}-${j}" type="number" inputmode="decimal" data-f="set" data-i="${i}" data-j="${j}" value="${st.val}" aria-label="第${j+1}组数量"><span class="mute small">${h(it.unit)}</span>${it.weighted?`<input id="w-${i}-${j}" type="number" inputmode="decimal" data-f="setw" data-i="${i}" data-j="${j}" value="${st.w||''}" placeholder="kg" aria-label="第${j+1}组负重">`:''}</div>${it.type==='time'&&!st.done?`<button class="hold" data-act="hold" data-i="${i}" data-j="${j}">计时</button>`:'<span></span>'}<button class="chk" data-act="chk" data-i="${i}" data-j="${j}" aria-label="${st.done?'取消完成':'完成这一组'}">✓</button></div>`).join('')}
    <button class="btn sm ghost" data-act="addset" data-i="${i}">加一组</button></section>`}).join('')}</div>
  <div id="tbar"><span class="t num" id="tt"></span><span class="grow small" id="tl"></span><button class="btn sm" data-act="t-add">+15 秒</button><button class="btn sm" data-act="t-skip">跳过</button></div>
  <footer><button class="btn" data-act="w-drop" data-confirm="再点一次，放弃本次训练">放弃</button><button class="btn ok" data-act="w-finish" data-confirm="再点一次，结束并保存">结束训练</button></footer></div>`;
  paintTick();
}
function paintTick(){
  const a=S.active;if(!a||!ui.wk)return;
  const c=$('#clock');if(c)c.textContent=mmss((Date.now()-a.start)/1000);
  const p=$('#prog');if(p){const all=a.items.reduce((n,i)=>n+i.sets.length,0),dn=a.items.reduce((n,i)=>n+i.sets.filter(x=>x.done).length,0);p.textContent='已完成 '+dn+' / '+all+' 组'}
  const bar=$('#tbar');if(!bar)return;
  if(!T){bar.classList.remove('on');return}
  const left=(T.end-Date.now())/1000;
  if(left<=0){const t=T;T=null;beep();bar.classList.remove('on');
    if(t.kind==='hold'){const st=a.items[t.i]&&a.items[t.i].sets[t.j];if(st&&!st.done){st.done=true;save();startRest();renderWk()}}
    return}
  bar.classList.add('on');$('#tt').textContent=mmss(left);$('#tl').textContent=T.label;
}
function startRest(){const r=S.settings.rest;T=r>0?{kind:'rest',end:Date.now()+r*1000,label:'组间休息'}:null}
let AC,wake;
function prime(){try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();AC.resume()}catch(e){}}
function beep(){try{[0,.25].forEach(d=>{const o=AC.createOscillator(),g=AC.createGain();o.connect(g);g.connect(AC.destination);o.frequency.value=880;const t=AC.currentTime+d;g.gain.setValueAtTime(.25,t);g.gain.exponentialRampToValueAtTime(.001,t+.2);o.start(t);o.stop(t+.2)})}catch(e){}}
async function keepAwake(){try{if(navigator.wakeLock&&S.active)wake=await navigator.wakeLock.request('screen')}catch(e){}}
function startWorkout(tplId){
  const t=S.templates.find(x=>x.id===tplId);if(!t)return;
  if(S.active){ui.wk=true;ui.sheet=null;return render()}
  S.active={id:uid(),tplId,name:t.name,start:Date.now(),items:t.items.map(it=>{const e=exById(it.exId);return e?{exId:e.id,name:e.name,type:e.type,unit:e.unit,target:e.target,weighted:!!e.weighted,sets:Array.from({length:it.sets},()=>({val:e.target,w:'',done:false}))}:null}).filter(Boolean)};
  save();ui.wk=true;ui.sheet=null;T=null;keepAwake();render();
}
function finishWorkout(){
  const a=S.active;if(!a)return;
  const s={id:a.id,name:a.name,start:a.start,end:Date.now(),items:a.items,strava:{state:'none'}};
  S.sessions.unshift(s);S.active=null;T=null;ui.wk=false;save();
  try{wake&&wake.release()}catch(e){}
  ui.sheet={t:'session',id:s.id};if(route()!=='history'){ui.keep=true;location.hash='history'}render();
  if(S.settings.strava.tok)syncSession(s);
}

/* ---------- Strava ---------- */
const ST='https://www.strava.com';
const redirectUri=()=>location.origin+location.pathname;
function authUrl(){return ST+'/oauth/authorize?client_id='+encodeURIComponent(S.settings.strava.clientId)+'&redirect_uri='+encodeURIComponent(redirectUri())+'&response_type=code&approval_prompt=auto&scope=activity:write,activity:read_all'}
async function tokenReq(p){
  const c=S.settings.strava;let r;
  try{r=await fetch(ST+'/oauth/token',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:new URLSearchParams({client_id:c.clientId,client_secret:c.clientSecret,...p})})}
  catch(e){throw new Error('连不上 Strava，请检查网络')}
  if(!r.ok)throw new Error('Strava 拒绝了授权（'+r.status+'），请核对 Client ID 和 Secret');
  const j=await r.json();c.tok={a:j.access_token,r:j.refresh_token,e:j.expires_at};if(j.athlete)c.athlete=j.athlete.firstname||'';save();
}
async function api(path,opt){
  const c=S.settings.strava;if(!c.tok)throw new Error('尚未连接 Strava');
  if(c.tok.e<Date.now()/1000+120)await tokenReq({grant_type:'refresh_token',refresh_token:c.tok.r});
  opt=opt||{};let r;
  try{r=await fetch(ST+'/api/v3'+path,{method:opt.method||'GET',body:opt.body,headers:{Authorization:'Bearer '+c.tok.a,...(opt.type?{'Content-Type':opt.type}:{})}})}
  catch(e){throw new Error('连不上 Strava，请检查网络')}
  if(r.status===401)throw new Error('Strava 授权已失效，请在设置里重新授权');
  if(r.status===429)throw new Error('Strava 请求太频繁，稍后再试');
  if(!r.ok)throw new Error('Strava 返回错误 '+r.status);
  return r.json();
}
async function finishAuth(code){
  try{await tokenReq({code,grant_type:'authorization_code'});ui.msg='已连接 Strava。'}catch(e){ui.msg=e.message}
  render();retryPending();
}
const localIso=t=>{const d=new Date(t);return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())+'T'+pad(d.getHours())+':'+pad(d.getMinutes())+':'+pad(d.getSeconds())+'Z'};
function pickOverlap(list,s){ // 选出与本次训练时间重叠最多的 Strava 活动
  let best=null,bo=0;
  for(const a of list||[]){const st=Date.parse(a.start_date),en=st+(a.elapsed_time||0)*1000;const o=Math.min(en,s.end)-Math.max(st,s.start);if(o>bo){bo=o;best=a}}
  return best;
}
async function syncSession(s,forceCreate){
  const mode='create',done=()=>{save();render()};
  s.strava={state:'pending',msg:'正在同步…'};render();
  try{
    const desc=logText(s);
    if(mode==='create'){
      const j=await api('/activities',{method:'POST',type:'application/x-www-form-urlencoded',body:new URLSearchParams({name:s.name,sport_type:'WeightTraining',start_date_local:localIso(s.start),elapsed_time:Math.max(1,Math.round((s.end-s.start)/1000)),description:desc})});
      s.strava={state:'done',id:j.id,msg:'已新建活动'};return done();
    }
    const list=await api('/athlete/activities?per_page=20&after='+Math.floor(s.start/1000-2700)+'&before='+Math.ceil(s.end/1000+2700));
    const hit=pickOverlap(list,s);
    if(!hit){s.strava={state:'pending',msg:'Strava 上还没有这个时间段的手表记录，打开 App 时会自动重试'};return done()}
    const d=await api('/activities/'+hit.id);
    const body={name:s.name,description:d.description&&d.description.indexOf(desc)<0?d.description+'\n\n'+desc:desc};
    await api('/activities/'+hit.id,{method:'PUT',type:'application/json',body:JSON.stringify(body)});
    s.strava={state:'done',id:hit.id,hr:d.average_heartrate||null,maxHr:d.max_heartrate||null,msg:d.average_heartrate?'已写入手表记录':'已写入，但这条活动没有心率数据'};done();
  }catch(e){s.strava={state:'error',msg:e.message};done()}
}
function retryPending(){
  if(!S.settings.strava.tok)return;
  S.sessions.filter(s=>s.strava&&s.strava.state==='pending'&&Date.now()-s.end<3*864e5).slice(0,3).forEach(s=>syncSession(s));
}

/* ---------- 事件 ---------- */
function armed(b){ // 危险操作要点两次
  if(!b.dataset.confirm||b.dataset.armed)return true;
  b.dataset.armed='1';b.dataset.label=b.textContent;b.textContent=b.dataset.confirm;
  setTimeout(()=>{if(b.isConnected){delete b.dataset.armed;b.textContent=b.dataset.label}},3000);return false;
}
function curTpl(){return ui.sheet&&S.templates.find(t=>t.id===ui.sheet.id)}
const A={
  close(){ui.sheet=null},
  'open-tpl'(b){ui.sheet={t:'tpl',id:b.dataset.id,edit:!!b.dataset.edit}},
  'tpl-edit'(){ui.sheet.edit=!ui.sheet.edit;save()},
  'tpl-new'(){const t={id:uid(),name:'新模版',items:[]};S.templates.push(t);save();ui.sheet={t:'tpl',id:t.id,edit:true}},
  'tpl-del'(){S.templates=S.templates.filter(t=>t.id!==ui.sheet.id);save();ui.sheet=null},
  'tpl-sets'(b){const it=curTpl().items[+b.dataset.i];it.sets=Math.min(12,Math.max(1,it.sets+ +b.dataset.d));save()},
  'tpl-up'(b){const a=curTpl().items,i=+b.dataset.i;if(i>0){[a[i-1],a[i]]=[a[i],a[i-1]];save()}},
  'tpl-rm'(b){curTpl().items.splice(+b.dataset.i,1);save()},
  'tpl-add'(){ui.sheet={t:'pick',id:ui.sheet.id}},
  pick(b){curTpl().items.push({exId:b.dataset.id,sets:3});save();b.textContent='已添加';return false},
  start(b){prime();startWorkout(b.dataset.id);return false},
  'open-ex'(b){ui.sheet={t:'ex',id:b.dataset.id,back:b.dataset.back}},
  'ex-new'(){ui.sheet={t:'exEdit',id:null}},
  'ex-edit'(b){ui.sheet={t:'exEdit',id:b.dataset.id}},
  'ex-noimg'(b){delete exById(b.dataset.id).img;save()},
  'ex-del'(b){const id=b.dataset.id;S.exercises=S.exercises.filter(e=>e.id!==id);S.templates.forEach(t=>t.items=t.items.filter(i=>i.exId!==id));save();ui.sheet=null},
  'ex-save'(b){saveEx(b.dataset.id);return false},
  'w-min'(){ui.wk=false},
  'w-resume'(){prime();ui.wk=true;keepAwake()},
  chk(b){prime();const st=S.active.items[+b.dataset.i].sets[+b.dataset.j];st.done=!st.done;if(st.done)startRest();else if(T&&T.kind==='rest')T=null;save()},
  hold(b){prime();const i=+b.dataset.i,j=+b.dataset.j,it=S.active.items[i],sec=+it.sets[j].val||it.target;T={kind:'hold',i,j,end:Date.now()+sec*1000,label:it.name+' 第 '+(j+1)+' 组，坚持住'};paintTick();return false},
  addset(b){const it=S.active.items[+b.dataset.i];it.sets.push({val:it.target,w:'',done:false});save()},
  't-add'(){if(T)T.end+=15000;paintTick();return false},
  't-skip'(){T=null;paintTick();return false},
  'w-drop'(){S.active=null;T=null;ui.wk=false;save()},
  'w-finish'(){finishWorkout();return false},
  'open-session'(b){ui.sheet={t:'session',id:b.dataset.id}},
  's-del'(b){S.sessions=S.sessions.filter(s=>s.id!==b.dataset.id);save();ui.sheet=null},
  's-sync'(b){syncSession(S.sessions.find(s=>s.id===b.dataset.id));return false},
  's-create'(b){syncSession(S.sessions.find(s=>s.id===b.dataset.id),true);return false},
  rest(b){S.settings.rest=Math.min(300,Math.max(0,S.settings.rest+ +b.dataset.d));save()},
  'st-off'(){const c=S.settings.strava;c.tok=null;c.athlete='';ui.msg='已断开 Strava。';save()},
  'st-paste'(){const v=$('#st-paste').value.trim(),m=v.match(/[?&]code=([^&\s]+)/);const code=m?m[1]:(/^[0-9a-f]{20,}$/i.test(v)?v:'');if(!code){ui.msg='没有在这段文字里找到授权码，请粘贴跳转后的完整网址。';return}finishAuth(code);return false},
  backup(){ui.sheet={t:'backup'}},
  'bk-copy'(){const t=$('#bk');t.select();(navigator.clipboard?navigator.clipboard.writeText(t.value):Promise.reject()).then(()=>$('#bk-msg').textContent='已复制。',()=>$('#bk-msg').textContent='自动复制失败，请长按文本框手动全选复制。');return false},
  'bk-load'(){try{const d=JSON.parse($('#bk').value);if(!d.exercises||!d.templates||!d.sessions)throw 0;const keep=S.settings.strava;S={...seed(),...d,active:null};S.settings.strava={...S.settings.strava,clientId:keep.clientId,clientSecret:keep.clientSecret,tok:keep.tok,athlete:keep.athlete};save();ui.sheet=null}catch(e){$('#bk-msg').textContent='内容不是有效的备份，没有做任何更改。';return false}}
};
function saveEx(id){
  const name=$('#e-name').value.trim();if(!name){$('#e-name').focus();return}
  const unit=$('#e-unit').value,lines=v=>v.split('\n').map(x=>x.trim()).filter(Boolean);
  const data={name,unit,type:unit.indexOf('秒')===0?'time':'reps',target:Math.max(1,+$('#e-target').value||1),weighted:$('#e-w').checked,cues:lines($('#e-cues').value),bad:lines($('#e-bad').value)};
  let e=id&&exById(id);if(e)Object.assign(e,data);else{e={id:uid(),...data};S.exercises.push(e)}
  const f=$('#e-img').files[0],fin=()=>{if(!save()){delete e.img;save()}ui.sheet={t:'ex',id:e.id};render()};
  if(!f)return fin();
  const img=new Image(),url=URL.createObjectURL(f);
  img.onload=()=>{const k=Math.min(1,480/Math.max(img.width,img.height)),c=document.createElement('canvas');c.width=img.width*k;c.height=img.height*k;c.getContext('2d').drawImage(img,0,0,c.width,c.height);e.img=c.toDataURL('image/jpeg',.72);URL.revokeObjectURL(url);fin()};
  img.onerror=fin;img.src=url;
}
document.addEventListener('click',ev=>{
  if(ev.target.id==='sheet'){ui.sheet=null;return render()}
  const b=ev.target.closest('[data-act]');if(!b||b.disabled)return;
  if(!armed(b))return;
  if(A[b.dataset.act](b)!==false)render();
});
document.addEventListener('input',ev=>{
  const el=ev.target,f=el.dataset.f;if(!f)return;const c=S.settings.strava;
  if(f==='set'||f==='setw'){const st=S.active&&S.active.items[+el.dataset.i].sets[+el.dataset.j];if(st)st[f==='set'?'val':'w']=el.value}
  else if(f==='tpl-name'){const t=curTpl();if(t)t.name=el.value||'未命名模版'}
  else if(f==='st-id')c.clientId=el.value.trim();
  else if(f==='st-sec')c.clientSecret=el.value.trim();
  save();
});
document.addEventListener('change',ev=>{const el=ev.target;if(el.dataset.f==='mode'){S.settings.strava.mode=el.value;save()}else if(el.dataset.f==='st-id'||el.dataset.f==='st-sec')render()});
window.addEventListener('hashchange',()=>{if(ui.keep)ui.keep=false;else ui.sheet=null;render()});
document.addEventListener('visibilitychange',()=>{if(!document.hidden){keepAwake();retryPending();paintTick()}});

/* ---------- 启动 ---------- */
tick=setInterval(paintTick,250);
if(S.active)ui.wk=false;
render();
(function(){
  let q;try{q=new URLSearchParams(location.search)}catch(e){return}
  const code=q.get('code'),err=q.get('error');
  if(code||err){try{history.replaceState(null,'',location.pathname+'#settings')}catch(e){}
    if(code)finishAuth(code);else{ui.msg='你在 Strava 取消了授权。';render()}}
  else retryPending();
})();
if('serviceWorker' in navigator&&location.protocol==='https:'){try{navigator.serviceWorker.register('sw.js').catch(()=>{})}catch(e){}}
</script>
