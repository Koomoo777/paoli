<title>跑力打卡</title>
<style>
/* 布局思路：iOS 原生观感。系统字体与分组列表，纯黑/浅灰底，唯一强调色是系统绿；发力部位用系统橙。数字用圆体。 */
:root{
  --bg:#f2f2f7; --panel:#ffffff; --panel2:#e5e5ea; --ink:#000000; --mute:#8a8a8e; --line:rgba(60,60,67,.2);
  --accent:#34c759; --on-accent:#ffffff; --hot:#ff9500; --red:#ff3b30; --warn:#ff9500; --tint:#1f9d45;
  --body:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Helvetica Neue",sans-serif;
  --round:ui-rounded,"SF Pro Rounded",-apple-system,"PingFang SC",sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#000000; --panel:#1c1c1e; --panel2:#2c2c2e; --ink:#ffffff; --mute:#98989f; --line:rgba(84,84,88,.65);
  --accent:#30d158; --on-accent:#00210b; --hot:#ff9f0a; --red:#ff453a; --warn:#ff9f0a; --tint:#30d158; color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#000000; --panel:#1c1c1e; --panel2:#2c2c2e; --ink:#ffffff; --mute:#98989f; --line:rgba(84,84,88,.65);
  --accent:#30d158; --on-accent:#00210b; --hot:#ff9f0a; --red:#ff453a; --warn:#ff9f0a; --tint:#30d158; color-scheme:dark;}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
html{min-height:calc(100% + env(safe-area-inset-top))}
body{background:var(--bg);color:var(--ink);font:17px/1.35 var(--body);overflow:hidden;overscroll-behavior:none;-webkit-font-smoothing:antialiased;-webkit-user-select:none;user-select:none}
input,textarea{-webkit-user-select:text;user-select:text}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
:focus-visible{outline:2px solid var(--tint);outline-offset:2px}
h1,h2,h3,p{margin:0}
h1,h2{text-wrap:balance}
h1{font-size:34px;line-height:1.2;font-weight:700;letter-spacing:.01em}
.num{font-family:var(--round);font-variant-numeric:tabular-nums}
.mute{color:var(--mute)} .small{font-size:13px;line-height:1.4}
[hidden]{display:none!important}

#shell{position:fixed;top:0;left:0;right:0;height:var(--H,100%);display:flex;flex-direction:column;max-width:560px;margin:0 auto}
#app{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:calc(env(safe-area-inset-top) + 10px) 16px calc(env(safe-area-inset-bottom) + 28px);display:flex;flex-direction:column;gap:14px}

/* 导航行 */
.top{display:flex;justify-content:space-between;align-items:center;min-height:44px}
.top a{color:var(--tint);text-decoration:none;font-size:17px;display:inline-flex;align-items:center;gap:2px;min-height:44px}
.top svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.top .date{font-size:13px;font-weight:600;color:var(--mute)}
.top a.me{color:var(--mute);font-size:15px;gap:8px}
.top a.me i{width:30px;height:30px;border-radius:50%;background:var(--panel2);color:var(--ink);font:600 14px/30px var(--round);text-align:center;font-style:normal}
.head{display:flex;justify-content:space-between;align-items:center;gap:12px}

/* 主页 */
.center{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding-bottom:6vh}
.ringbtn{position:relative;width:216px;height:216px;margin-bottom:30px;transition:transform .18s ease}
.ringbtn:active{transform:scale(.96)}
.ringbtn svg{position:absolute;inset:0;width:100%;height:100%}
.ringbtn circle{fill:none;stroke:var(--accent);stroke-width:15}
.ringbtn .trk{opacity:.2} .ringbtn .arc{stroke-linecap:round}
.ringbtn .core{position:absolute;inset:31px;border-radius:50%;background:var(--accent);display:grid;place-items:center}
.ringbtn .core svg{position:static;width:56px;height:56px;fill:var(--on-accent);margin-left:6px}
.center h1{font-size:28px}
.center .sub{font-size:15px;color:var(--mute);margin-top:6px}
.center .wk-goal{font:600 13px var(--round);color:var(--mute);margin-top:22px;padding:6px 12px;border-radius:99px;background:var(--panel)}

/* 分组卡片与按钮 */
h3{font-size:13px;font-weight:400;color:var(--mute);padding:6px 16px 0}
.card h3{padding:0}
.card{background:var(--panel);border-radius:16px;padding:14px 16px;display:flex;flex-direction:column;gap:12px}
.row{display:flex;align-items:center;gap:12px}
.grow{flex:1;min-width:0}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:0 16px;border-radius:12px;background:var(--panel2);font-weight:600;font-size:17px;text-decoration:none;color:var(--ink);transition:opacity .15s}
.btn:active{opacity:.6}
.btn.go,.btn.ok{background:var(--accent);color:var(--on-accent)}
.btn.stop{background:var(--red);color:#fff}
.btn.tint{background:color-mix(in srgb,var(--tint) 16%,transparent);color:var(--tint)}
.btn.ghost{background:none;color:var(--tint);font-weight:400}
.btn.lg{min-height:54px;border-radius:16px}
.btn.sm{min-height:34px;padding:0 14px;font-size:15px;border-radius:99px}
.btn.wide{width:100%}
.btn[data-confirm]:not(.go):not(.ok){color:var(--red)}
.btn[data-armed],.btn[data-armed].go{background:var(--red);color:#fff}
.pill{display:inline-block;font-size:12px;font-weight:600;padding:3px 9px;border-radius:99px;background:var(--panel2);color:var(--mute);white-space:nowrap}
.pill.ok{background:color-mix(in srgb,var(--accent) 18%,transparent);color:var(--tint)}
.pill.wait{background:color-mix(in srgb,var(--warn) 18%,transparent);color:var(--warn)}
.pill.bad{background:color-mix(in srgb,var(--red) 16%,transparent);color:var(--red)}

.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.day{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;color:var(--mute)}
.day i{width:30px;height:30px;border-radius:50%;border:2.5px solid var(--panel2)}
.day.hit i{background:var(--accent);border-color:var(--accent)}
.day.today{color:var(--ink);font-weight:600}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stats div{display:flex;flex-direction:column;gap:2px}
.stats b{font:700 30px/1 var(--round)}

.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.tile{background:var(--panel);border-radius:16px;padding:12px 14px 14px;text-align:left;display:flex;flex-direction:column;gap:2px;position:relative;width:100%}
.sheet .tile{background:var(--panel2)}
.tile .no{position:absolute;left:12px;top:10px;font:600 13px var(--round);color:var(--mute)}
.tile b{font-size:16px;line-height:1.3;font-weight:600}
.fig{width:84px;height:84px;align-self:center;display:block;flex:none}
.fig .b{stroke:var(--ink);fill:none;stroke-width:4.5;stroke-linecap:round;stroke-linejoin:round}
.fig .h{stroke:var(--hot)} .fig .p{stroke:var(--mute);stroke-width:2.5;opacity:.6}
.fig .d{stroke-dasharray:4 4;stroke:var(--hot);stroke-width:3}
.fig circle{fill:var(--ink)}
.figbig{width:150px;height:150px}
.thumb{width:84px;height:84px;border-radius:12px;object-fit:cover;align-self:center;flex:none}

/* 弹层 */
#sheet,#wk{position:fixed;top:0;left:0;right:0;height:var(--H,100%);display:none}
#sheet.on{display:flex;z-index:30;background:rgba(0,0,0,.4);align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:560px;max-height:92%;border-radius:20px 20px 0 0;display:flex;flex-direction:column}
.sheet::before{content:"";width:36px;height:5px;border-radius:3px;background:var(--panel2);align-self:center;margin-top:6px}
.sheet header{display:flex;align-items:center;gap:12px;padding:8px 16px 12px}
.sheet header h2{flex:1;font-size:20px;font-weight:700}
.sheet .body{overflow-y:auto;padding:4px 16px 16px;display:flex;flex-direction:column;gap:14px}
.sheet .body>div:not(.grid):not(.row):not(.two):not(.stats){background:var(--panel);border-radius:16px;padding:0 16px}
.sheet footer{padding:10px 16px calc(12px + env(safe-area-inset-bottom));display:flex;gap:10px}
.sheet footer .btn{flex:1;min-height:50px;border-radius:14px}
.x{width:30px;height:30px;border-radius:50%;background:var(--panel2);font-size:14px;color:var(--mute);font-weight:700}
.cues{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:8px;font-size:16px;line-height:1.4}
.cues li::marker{color:var(--mute);font-family:var(--round);font-weight:600}
.cues.bad li::marker{color:var(--red)}
label.f{display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--mute)}
input[type=text],input[type=number],input[type=password],select,textarea{background:var(--panel);border:0;border-radius:12px;padding:11px 14px;color:var(--ink);width:100%;font-size:17px;-webkit-appearance:none;appearance:none}
.card input[type=text],.card input[type=number],.card input[type=password]{background:var(--bg)}
textarea{min-height:96px;resize:vertical}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.erow{display:flex;align-items:center;gap:8px;padding:9px 0;border-bottom:.5px solid var(--line)}
.erow:last-child{border-bottom:0}
.step{display:flex;align-items:center;gap:8px}
.step button{width:36px;height:32px;border-radius:8px;background:var(--panel2);font-weight:600;font-size:18px}
.step span{min-width:22px;text-align:center;font:600 18px var(--round)}
.hrow{display:flex;gap:12px;align-items:center;width:100%;text-align:left;padding:12px 0;border-bottom:.5px solid var(--line)}
.hrow:last-child{border-bottom:0}
.hrow .date{font:600 17px/1 var(--round);width:48px;color:var(--mute)}
.hrow b{font-weight:600}
.hrow::after{content:"›";color:var(--mute);font-size:20px;opacity:.6}
pre.log{margin:0;white-space:pre-wrap;font:16px/1.6 var(--body)}
ol.steps{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px;font-size:15px}
code{background:var(--panel2);padding:1px 6px;border-radius:6px;font-size:13px;word-break:break-all}
.note{font-size:13px;padding:10px 12px;border-radius:12px;background:color-mix(in srgb,var(--warn) 14%,transparent)}

/* 训练中：一次只看一个动作、一组 */
#wk.on{display:flex;z-index:20;background:var(--bg);justify-content:center}
.wk{width:100%;max-width:560px;display:flex;flex-direction:column;height:100%}
.bar{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:calc(env(safe-area-inset-top) + 4px) 8px 4px}
.bar>button{min-width:44px;min-height:44px;color:var(--tint);font-size:17px;justify-self:start;padding:0 8px;display:inline-flex;align-items:center}
.bar>button:last-child{justify-self:end}
.bar svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.bar [data-armed]{color:var(--red);font-weight:600}
.pager{display:flex;align-items:center;gap:2px;font:600 17px var(--round)}
.pager button{width:40px;height:44px;color:var(--tint);display:grid;place-items:center}
.pager button:disabled{opacity:.25}
.prog{height:3px;background:var(--panel2);margin:0 16px;border-radius:2px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--accent);border-radius:2px;transition:width .3s}
.wk .list{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:18px 16px 20px;display:flex;flex-direction:column;gap:14px}
.xhead{display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
.xhead h1{font-size:32px}
.xhead .clock{font:600 17px var(--round);color:var(--mute);padding-bottom:3px}
.dots{display:flex;gap:7px;align-items:center}
.dots i{width:9px;height:9px;border-radius:50%;background:var(--panel2)}
.dots i.on{background:var(--accent)} .dots i.cur{background:none;box-shadow:inset 0 0 0 2.5px var(--accent)}
.dots span{font-size:15px;color:var(--mute);margin-left:6px}
.hero{flex-direction:row;align-items:center;gap:8px;padding:16px 14px}
.hero .fig,.hero .thumb{width:104px;height:104px}
.heromain{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:2px}
.big{font:700 58px/1.05 var(--round);text-align:center;letter-spacing:-.01em}
.stepper{display:flex;align-items:center;gap:6px}
.stepper button{width:42px;height:42px;border-radius:50%;background:var(--panel2);font-size:24px;line-height:1;color:var(--tint);flex:none}
.stepper input.big{width:104px;padding:0;background:none!important;border-radius:0;font:700 58px/1.05 var(--round);text-align:center}
.unit{font-size:15px;color:var(--mute)}
.kg{display:flex;align-items:center;gap:6px;margin-top:6px;font-size:15px;color:var(--mute)}
.kg input{width:76px;padding:6px 8px;text-align:center;background:var(--bg)}
.links{display:flex;justify-content:center;gap:24px;padding-top:4px}
.links button{font-size:15px;color:var(--tint);min-height:36px}
.links [data-confirm]{color:var(--red)}

<div id="shell">
  <main id="app"></main>

<div id="sheet"></div>
<script>
"use strict";
/* ---------- 数据 ---------- */
const KEY='paoli.v1';
const DG={

 legraise:{head:[14,83],b:['22,86 52,86','24,88 42,88'],h:['52,86 84,56'],p:['92,68 92,54','89,57 92,54 95,57']},
 pullup:{head:[50,23],b:['41,34 59,34','50,34 50,62','44,62 56,62','45,62 45,82','55,62 55,82'],h:['34,14 28,30 41,34','66,14 72,30 59,34'],p:['20,14 80,14']}
};
const SEED_EX=[
 {id:'wallsit',name:'靠墙静蹲',type:'time',unit:'秒',target:45,dg:'wallsit',
  cues:['后脑、上背、腰骶三点贴墙','大腿与地面平行，膝盖约 90°','膝盖在脚踝正上方，对准第二脚趾','重心压在脚跟和全脚掌，保持均匀呼吸'],
  bad:['手撑在大腿上借力','膝盖内扣，或臀部滑到比膝盖还低']},
 {id:'calf',name:'单腿地面提踵',type:'reps',unit:'次/侧',target:15,dg:'calf',
  cues:['指尖轻扶墙，只用来保持平衡','用大脚趾球发力垂直向上，顶到最高点停 1 秒','下放用 2 到 3 秒，脚跟轻触地面再起','膝盖保持伸直但不锁死，身体不前后晃'],
  bad:['脚踝向外翻，重心落到小脚趾一侧','借弹震快速上下，没有顶峰停顿']},
 {id:'squat',name:'自重深蹲',type:'reps',unit:'次',target:15,dg:'squat',
  cues:['双脚与肩同宽，脚尖外展 15° 到 30°','屈髋屈膝同时启动，像坐向身后的椅子','膝盖始终对准脚尖方向','胸口打开、腰背中立，蹲到大腿至少平行地面','起身时脚跟蹬地，髋和胸一起上升'],
  bad:['膝盖内扣','起身时臀部先抬、上身前倒','脚跟离地']},
 {id:'lunge',name:'箭步走',type:'reps',unit:'步',target:20,dg:'lunge',
  cues:['步幅以前后膝都接近 90° 为准','上身挺直，核心收紧，目视前方','后膝垂直下沉，接近地面但不砸地','前脚全脚掌蹬地，把身体带到下一步'],
  bad:['前膝内扣或身体左右晃','步子太小，前膝大幅超过脚尖且脚跟离地']},
 {id:'bulgarian',name:'自重保加利亚蹲',type:'reps',unit:'次/侧',target:10,dg:'bulgarian',
  cues:['后脚脚背搭在约膝盖高的凳子上','前脚离凳两个脚掌左右，下蹲时前小腿接近垂直','重心放在前腿，后腿只负责平衡','上身略前倾，髋部保持水平，垂直下沉'],
  bad:['前脚离凳太近，膝盖压力大','用后腿蹬凳子借力','骨盆向一侧旋转或倾斜']},
 {id:'crab',name:'弹力带螃蟹行走',type:'reps',unit:'步/向',target:15,dg:'crab',
  cues:['弹力带套在膝上方或脚踝，保持微屈髋屈膝的半蹲','全程让弹力带保持张力，双脚不并拢','横向迈步由臀部外侧发力，脚尖朝前','上身稳定，不随步伐左右摇摆'],
  bad:['膝盖被弹力带拉向内','拖着后脚走，或靠上身晃动带动']},
 {id:'pushup',name:'俯卧撑',type:'reps',unit:'次',target:15,dg:'pushup',
  cues:['双手略宽于肩，手腕在肩的正下方','从头到脚跟一条直线，收紧腹部和臀部','下放时手肘与躯干约成 45°，胸口接近地面','推起到手臂伸直，肩胛自然前伸'],
  bad:['塌腰或撅臀','手肘外展到 90°','只做半程']},
 {id:'plank',name:'平板支撑',type:'time',unit:'秒',target:45,dg:'plank',
  cues:['手肘在肩的正下方，前臂平行','收腹、夹臀，骨盆略后倾','头、背、臀、脚跟成一条直线','前臂向下推地，保持自然呼吸'],
  bad:['塌腰，腰椎受压','臀部抬得过高','憋气、耸肩']},
 {id:'crunch',name:'卷腹',type:'reps',unit:'次',target:30,dg:'crunch',
  cues:['仰卧屈膝，双脚踩实，下背全程贴地','双手轻扶耳侧，手肘打开，不抱头发力','呼气，用腹部把肩胛骨卷离地面，胸口靠向骨盆','顶峰停一下，吸气慢慢放回，肩膀不完全落地'],
  bad:['双手拉扯脖子，下巴顶住胸口','整个上身坐起来，变成髋部发力','借惯性快速弹起']},
 {id:'legraise',name:'平躺抬腿',type:'reps',unit:'次',target:12,dg:'legraise',
  cues:['仰卧，双手放身体两侧或垫在臀部下方','先收紧腹部，把下背压向地面','双腿并拢、膝盖微屈，抬到与地面接近垂直','下放用 2 到 3 秒，脚跟接近地面但不落地'],
  bad:['下放时腰部拱起离开地面','靠甩腿借力','下放太快，没有控制']},
 {id:'pullup',name:'引体向上',type:'reps',unit:'次',target:3,dg:'pullup',
  cues:['正手握杠，略宽于肩，从手臂完全伸直的悬垂开始','先下沉肩胛、挺胸，再屈肘上拉','想着把手肘拉向身体两侧的口袋，下巴过杠','下放用 2 到 3 秒，回到手臂伸直','核心收紧，双腿不前后摆动'],
  bad:['耸肩，只用手臂硬拉','蹬腿摆荡借力','只做半程，下放不到底']}
];
const SEED_TPL=[{id:'run-strength',name:'跑步力量',items:[['wallsit',5],['calf',5],['squat',5],['lunge',3],['bulgarian',3],['crab',3],['pushup',5],['plank',5],['crunch',5],['legraise',3],['pullup',3]].map(([exId,sets])=>({exId,sets}))}];
function seed(){return{v:2,exercises:JSON.parse(JSON.stringify(SEED_EX)),templates:JSON.parse(JSON.stringify(SEED_TPL)),sessions:[],active:null,
  settings:{rest:60,strava:{clientId:'296998',clientSecret:'',mode:'merge',tok:null,athlete:''}}}}
let S=load();if(!S.settings.strava.clientId)S.settings.strava.clientId='296998';
function load(){try{const r=localStorage.getItem(KEY);if(r){const d=JSON.parse(r);if(d&&d.exercises&&d.templates)return d}}catch(e){}return seed()}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));return true}catch(e){return false}}
const ui={sheet:null,wk:false,msg:''};
let T=null,tick=null;

/* ---------- 工具 ---------- */
const $=s=>document.querySelector(s);
const h=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const exById=id=>S.exercises.find(e=>e.id===id);
const pad=n=>String(n).padStart(2,'0');
const mmss=sec=>{sec=Math.max(0,Math.round(sec));return pad(Math.floor(sec/60))+':'+pad(sec%60)};
const dur=sec=>{const m=Math.round(sec/60);return m<60?m+' 分钟':Math.floor(m/60)+' 小时 '+(m%60)+' 分'};
const dayKey=t=>{const d=new Date(t);return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())};
function fig(ex,cls){
  if(ex&&ex.img)return `<img class="thumb ${cls||''}" src="${ex.img}" alt="">`;
  const d=ex&&DG[ex.dg];
  if(!d)return `<svg class="fig ${cls||''}" viewBox="0 0 100 100" aria-hidden="true"><polyline class="b p" points="6,90 94,90"/><polyline class="b p" points="30,50 70,50"/><polyline class="b p" points="50,30 50,70"/></svg>`;
  const pl=(a,c)=>(a||[]).map(p=>`<polyline class="b ${c}" points="${p}"/>`).join('');
  return `<svg class="fig ${cls||''}" viewBox="0 0 100 100" role="img" aria-label="${h(ex.name)}示意图"><polyline class="b p" points="6,90 94,90"/>${pl(d.p,'p')}${pl(d.b,'')}${pl(d.h,'h')}${pl(d.d,'d')}<circle cx="${d.head[0]}" cy="${d.head[1]}" r="6.5"/></svg>`;
}
function logText(s){
  const lines=s.items.map(it=>{const dn=it.sets.filter(x=>x.done);if(!dn.length)return null;
    const v=dn.map(x=>x.val+(x.w?'×'+x.w+'kg':''));const same=v.every(a=>a===v[0]);
    return it.name+'  '+(same?dn.length+' 组 × '+v[0]:v.join(' / '))+' '+it.unit}).filter(Boolean);
  return lines.join('\n');
}
function weekInfo(){
  const now=new Date(),mon=new Date(now.getFullYear(),now.getMonth(),now.getDate()-((now.getDay()+6)%7));
  const days=new Set(S.sessions.map(s=>dayKey(s.start)));
  const wk=[...'一二三四五六日'].map((n,i)=>{const d=new Date(mon);d.setDate(mon.getDate()+i);return{n,hit:days.has(dayKey(d)),today:dayKey(d)===dayKey(now)}});
  const weekOf=t=>{const d=new Date(t);const m=new Date(d.getFullYear(),d.getMonth(),d.getDate()-((d.getDay()+6)%7));return Math.round(m.getTime()/864e5/7)};
  const weeks=new Set(S.sessions.map(s=>weekOf(s.start)));let cur=weekOf(now),streak=0;
  if(!weeks.has(cur))cur--;while(weeks.has(cur)){streak++;cur--}
  return{wk,streak,count:wk.filter(d=>d.hit).length};
}

/* ---------- 页面 ---------- */
function route(){const r=location.hash.slice(1);return['home','me','prefs','moves'].includes(r)?r:'home'}
function render(){
  const r=route();
  $('#app').innerHTML=({home:vHome,me:vMe,prefs:vSettings,moves:vMoves})[r]();
  renderWk();renderSheet();
}
function resumeBar(){return S.active&&!ui.wk?`<button class="resume" data-act="w-resume"><span class="grow">训练进行中：${h(S.active.name)}</span><span>继续</span></button>`:''}
const WHO='Koomoo';
function vHome(){
  const t=S.templates[0],w=weekInfo(),a=S.active,goal=3,C=2*Math.PI*92,arc=C*Math.min(1,w.count/goal);
  const date=new Date().toLocaleDateString('zh-CN',{month:'long',day:'numeric',weekday:'long'});
  return `<div class="top"><span class="date">${date}</span><a class="me" href="#me"><span>${WHO}</span><i>${WHO[0]}</i></a></div>
  <div class="center">
    <button class="ringbtn" data-act="${a?'w-resume':'start'}" data-id="${t?t.id:''}" aria-label="${a?'继续训练':'开始训练'}">
      <svg viewBox="0 0 216 216" aria-hidden="true"><circle class="trk" cx="108" cy="108" r="92"/>${arc?`<circle class="arc" cx="108" cy="108" r="92" stroke-dasharray="${arc} ${C}" transform="rotate(-90 108 108)"/>`:''}</svg>
      <span class="core"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4.6v14.8a1.2 1.2 0 0 0 1.8 1l12.4-7.4a1.2 1.2 0 0 0 0-2L8.8 3.6a1.2 1.2 0 0 0-1.8 1z"/></svg></span>
    </button>
    <h1>${h(a?a.name:t?t.name:'还没有训练模版')}</h1>
    <p class="sub">${a?'训练进行中，点按继续':t?t.items.length+' 个动作 · '+t.items.reduce((n,i)=>n+i.sets,0)+' 组':'在设置里新建一个'}</p>
    <p class="wk-goal">本周 ${w.count} / ${goal} 天</p>
  </div>`;
}
function vMoves(){
  return `<div class="top"><a href="#prefs"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>设置</a><span></span></div><div class="head"><h1>动作与要点</h1><button class="btn sm go" data-act="ex-new">添加动作</button></div>
  <div class="grid">${S.exercises.map(e=>`<button class="tile" data-act="open-ex" data-id="${e.id}">${fig(e)}<b>${h(e.name)}</b><span class="mute small">目标 ${e.target} ${h(e.unit)}</span></button>`).join('')}</div>`;
}
function stPill(s){const st=s.strava||{};return st.state==='done'?'<span class="pill ok">已同步 Strava</span>':st.state==='pending'?'<span class="pill wait">等待手表记录</span>':st.state==='error'?'<span class="pill bad">同步失败</span>':'<span class="pill">未同步</span>'}
function vMe(){
  const w=weekInfo();
  const list=S.sessions.length?`<section class="card" style="gap:0;padding-top:2px;padding-bottom:2px">${S.sessions.map(s=>{const d=new Date(s.start);
    return `<button class="hrow" data-act="open-session" data-id="${s.id}"><span class="date">${d.getMonth()+1}/${d.getDate()}</span><span class="grow"><b>${h(s.name)}</b><br><span class="mute small">${dur((s.end-s.start)/1000)} · ${s.items.reduce((a,i)=>a+i.sets.filter(x=>x.done).length,0)} 组</span></span>${stPill(s)}</button>`}).join('')}</section>`
    :'<section class="card"><p class="mute">还没有记录。完成第一次训练后会出现在这里。</p></section>';
  return `<div class="top"><a href="#home"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>主页</a><a href="#prefs" aria-label="设置"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="2.8"/><circle cx="12" cy="12" r="7"/><circle cx="12" cy="12" r="9.3" stroke-width="2.6" stroke-dasharray="2.9 4.4" stroke-linecap="butt"/></svg></a></div>
  <h1>${WHO}</h1>
  <section class="card"><div class="stats"><div><b>${S.sessions.length}</b><span class="mute small">累计训练</span></div><div><b>${w.count}</b><span class="mute small">本周天数</span></div><div><b>${w.streak}</b><span class="mute small">连续周数</span></div></div>
  <div class="week">${w.wk.map(d=>`<div class="day${d.hit?' hit':''}${d.today?' today':''}"><i></i>${d.n}</div>`).join('')}</div></section>
  <h3>历史记录</h3>${list}`;
}
function vSettings(){
  const c=S.settings.strava,preview=/claude/.test(location.host),ok=!!c.tok;
  return `<div class="top"><a href="#me"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>返回</a><span></span></div><h1>设置</h1>
  <section class="card"><h3>训练内容</h3><div class="row">${S.templates[0]?`<button class="btn grow" data-act="open-tpl" data-id="${S.templates[0].id}" data-edit="1">编辑训练模版</button>`:'<button class="btn grow" data-act="tpl-new">新建模版</button>'}<a class="btn grow" href="#moves">动作与要点</a></div></section>
  <section class="card"><h3>组间休息</h3><div class="row"><span class="grow">每组完成后自动倒计时</span><div class="step"><button data-act="rest" data-d="-15" aria-label="减少">−</button><span style="min-width:48px">${S.settings.rest} 秒</span><button data-act="rest" data-d="15" aria-label="增加">+</button></div></div></section>
  <section class="card"><div class="row"><h3 class="grow">STRAVA</h3>${ok?`<span class="pill ok">已连接${c.athlete?' '+h(c.athlete):''}</span>`:'<span class="pill">未连接</span>'}</div>
    ${preview?'<p class="note">这个预览页面会拦截发往 Strava 的请求。把 App 部署到你自己的网址后，连接和上传才能生效。</p>':''}
    ${ui.msg?`<p class="note">${h(ui.msg)}</p>`:''}
    <ol class="steps"><li>在 strava.com/settings/api 的“客户端密钥”一栏点“显示”，复制那串字符</li><li>粘贴到下面的 Client Secret</li><li>点“连接 Strava”并授权</li></ol>
    <div class="two"><label class="f" for="st-id">Client ID<input id="st-id" type="text" inputmode="numeric" data-f="st-id" value="${h(c.clientId)}"></label><label class="f" for="st-sec">Client Secret<input id="st-sec" type="password" data-f="st-sec" value="${h(c.clientSecret)}"></label></div>
    <div class="row">${c.clientId&&c.clientSecret?`<a class="btn go grow" href="${h(authUrl())}">${ok?'重新授权':'连接 Strava'}</a>`:'<span class="mute small grow">填好两项后出现连接按钮</span>'}${ok?'<button class="btn" data-act="st-off">断开</button>':''}</div>
    <label class="f" for="st-paste">授权后没有自动回到 App？把跳转后的完整网址粘贴到这里<input id="st-paste" type="text" placeholder="https://…?code=…"></label><button class="btn sm" data-act="st-paste">用这个网址完成连接</button>
    <p class="small mute">连接后，每次结束训练会自动在 Strava 新建一条力量训练，写入动作和组数。</p>
  </section>
  <section class="card"><h3>备份</h3><p class="small mute">数据只保存在这台手机的这个 App 里。换手机或清除网站数据前，先复制一份备份。</p><div class="row"><button class="btn grow" data-act="backup">备份与恢复</button></div></section>
  <p class="small mute" style="text-align:center">版本 6</p>`;
}

/* ---------- 弹层 ---------- */
function renderSheet(){
  const el=$('#sheet'),s=ui.sheet;el.classList.toggle('on',!!s);if(!s){el.innerHTML='';return}
  el.innerHTML='<div class="sheet" role="dialog" aria-modal="true">'+({tpl:shTpl,ex:shEx,exEdit:shExEdit,pick:shPick,session:shSession,backup:shBackup})[s.t](s)+'</div>';
}
const shHead=(t,extra)=>`<header>${extra||''}<h2>${t}</h2><button class="x" data-act="close" aria-label="关闭">✕</button></header>`;
function shTpl(s){
  const t=S.templates.find(x=>x.id===s.id);if(!t)return shHead('模版不存在');
  if(s.edit)return shHead('编辑模版')+`<div class="body"><label class="f" for="tpl-name">模版名称<input id="tpl-name" type="text" data-f="tpl-name" value="${h(t.name)}"></label>
    <div>${t.items.map((it,i)=>{const e=exById(it.exId);return `<div class="erow"><span class="grow">${h(e?e.name:'已删除的动作')}</span><div class="step"><button data-act="tpl-sets" data-i="${i}" data-d="-1" aria-label="减一组">−</button><span>${it.sets}</span><button data-act="tpl-sets" data-i="${i}" data-d="1" aria-label="加一组">+</button></div><button class="btn sm" data-act="tpl-up" data-i="${i}" ${i?'':'disabled'} aria-label="上移">↑</button><button class="btn sm" data-act="tpl-rm" data-i="${i}" aria-label="移除">✕</button></div>`}).join('')}</div>
    <button class="btn ghost" data-act="tpl-add">添加动作</button><button class="btn ghost" data-act="tpl-del" data-confirm="再点一次，删除这个模版">删除模版</button></div><footer><button class="btn go" data-act="tpl-edit">完成</button></footer>`;

function curItem(){const a=S.active;if(a.cur==null||!a.items[a.cur])a.cur=0;return a.items[a.cur]}
const allDone=()=>S.active.items.every(i=>i.sets.every(x=>x.done));
function advance(){ // 当前动作做完后跳到下一个还没做完的动作
  const a=S.active;if(a.items[a.cur].sets.some(x=>!x.done))return;
  let k=a.items.findIndex((it,n)=>n>a.cur&&it.sets.some(x=>!x.done));if(k<0)k=a.items.findIndex(it=>it.sets.some(x=>!x.done));
  if(k>=0)a.cur=k;
}
function renderWk(){

  else if(j<0){main='<div class="big num">'+it.sets.length+'</div><div class="unit">组，已完成</div>';btn='<button class="btn go lg wide" data-act="w-nextopen">去下一个没做完的动作</button>'}

  }else{
    main=`<div class="stepper"><button data-act="bump" data-d="-1" aria-label="减一">−</button><input id="v-${i}-${j}" class="big num" type="number" inputmode="numeric" data-f="set" data-i="${i}" data-j="${j}" value="${h(it.sets[j].val)}" aria-label="本组数量"><button data-act="bump" data-d="1" aria-label="加一">+</button></div><div class="unit">${h(it.unit)}</div>`;
    btn=`<button class="btn go lg wide" data-act="chk" data-i="${i}" data-j="${j}">完成第 ${j+1} 组</button>`;
  }
  const kg=it.weighted&&j>=0?`<label class="kg" for="w-${i}-${j}">负重<input id="w-${i}-${j}" type="number" inputmode="decimal" data-f="setw" data-i="${i}" data-j="${j}" value="${h(it.sets[j].w||'')}">kg</label>`:'';
  el.innerHTML=`<div class="wk"><header class="bar"><button data-act="w-min" aria-label="收起"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 9l7 7 7-7"/></svg></button>
    <div class="pager"><button data-act="w-go" data-d="-1" ${i?'':'disabled'} aria-label="上一个动作"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></button><span>${i+1} / ${n}</span><button data-act="w-go" data-d="1" ${i<n-1?'':'disabled'} aria-label="下一个动作"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg></button></div>
    <button data-act="w-finish" data-confirm="确认结束">结束</button></header>
  <div class="prog"><i style="width:${tot?dn/tot*100:0}%"></i></div>
  <div class="list">
    <div class="xhead"><h1>${h(it.name)}</h1><span class="clock" id="clock">00:00</span></div>
    <div class="dots">${it.sets.map((x,k)=>`<i class="${x.done?'on':k===j?'cur':''}"></i>`).join('')}<span>${j<0?'已完成':'第 '+(j+1)+' 组'}，共 ${it.sets.length} 组</span></div>
    <section class="card hero">${fig(e)}<div class="heromain">${main}${kg}</div></section>
    ${e.cues&&e.cues.length?`<h3>姿势要点</h3><section class="card"><ol class="cues">${e.cues.map(c=>`<li>${h(c)}</li>`).join('')}</ol></section>`:''}
    ${e.bad&&e.bad.length?`<h3>常见错误</h3><section class="card"><ul class="cues bad">${e.bad.map(c=>`<li>${h(c)}</li>`).join('')}</ul></section>`:''}
    <div class="links">${it.sets.some(x=>x.done)?'<button data-act="undo">撤销上一组</button>':''}<button data-act="w-drop" data-confirm="再点一次，放弃本次训练">放弃训练</button></div>
  </div>
  <footer><div class="rest" id="rest"><span class="mute">休息</span><span class="t num" id="tt"></span><span class="grow"></span><button class="btn sm tint" data-act="t-add">+15 秒</button><button class="btn sm tint" data-act="t-skip">跳过</button></div>${btn}</footer></div>`;
  paintTick();
}
function paintTick(){
  const a=S.active;if(!a||!ui.wk)return;
  const c=$('#clock');if(c)c.textContent=mmss((Date.now()-a.start)/1000);
  if(T&&T.kind==='hold'){const b=$('#big');if(b&&T.i===a.cur)b.textContent=mmss((Date.now()-T.start)/1000)}
  const r=$('#rest');if(!r)return;
  if(T&&T.kind==='rest'){const left=(T.end-Date.now())/1000;
    if(left<=0){T=null;beep();r.classList.remove('on')}else{r.classList.add('on');$('#tt').textContent=mmss(left)}}
  else r.classList.remove('on');
}
function startRest(){const r=S.settings.rest;T=r>0?{kind:'rest',end:Date.now()+r*1000,label:'组间休息'}:null}
let AC,wake;
function prime(){try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();AC.resume()}catch(e){}}
function beep(){try{[0,.25].forEach(d=>{const o=AC.createOscillator(),g=AC.createGain();o.connect(g);g.connect(AC.destination);o.frequency.value=880;const t=AC.currentTime+d;g.gain.setValueAtTime(.25,t);g.gain.exponentialRampToValueAtTime(.001,t+.2);o.start(t);o.stop(t+.2)})}catch(e){}}
async function keepAwake(){try{if(navigator.wakeLock&&S.active)wake=await navigator.wakeLock.request('screen')}catch(e){}}
function startWorkout(tplId){
  const t=S.templates.find(x=>x.id===tplId);if(!t)return;
  if(S.active){ui.wk=true;ui.sheet=null;return render()}
  S.active={id:uid(),tplId,name:t.name,start:Date.now(),items:t.items.map(it=>{const e=exById(it.exId);return e?{exId:e.id,name:e.name,type:e.type,unit:e.unit,target:e.target,weighted:!!e.weighted,sets:Array.from({length:it.sets},()=>({val:e.target,w:'',done:false}))}:null}).filter(Boolean)};
  save();ui.wk=true;ui.sheet=null;T=null;keepAwake();render();
}
function finishWorkout(){
  const a=S.active;if(!a)return;
  const s={id:a.id,name:a.name,start:a.start,end:Date.now(),items:a.items,strava:{state:'none'}};
  S.sessions.unshift(s);S.active=null;T=null;ui.wk=false;save();
  try{wake&&wake.release()}catch(e){}
  ui.sheet={t:'session',id:s.id};if(route()!=='me'){ui.keep=true;location.hash='me'}render();
  if(S.settings.strava.tok)syncSession(s);
}

/* ---------- Strava ---------- */
const ST='https://www.strava.com';
const redirectUri=()=>location.origin+location.pathname;
function authUrl(){return ST+'/oauth/authorize?client_id='+encodeURIComponent(S.settings.strava.clientId)+'&redirect_uri='+encodeURIComponent(redirectUri())+'&response_type=code&approval_prompt=auto&scope=activity:write,activity:read_all'}
async function tokenReq(p){
  const c=S.settings.strava;let r;
  try{r=await fetch(ST+'/oauth/token',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:new URLSearchParams({client_id:c.clientId,client_secret:c.clientSecret,...p})})}
  catch(e){throw new Error('连不上 Strava，请检查网络')}
  if(!r.ok)throw new Error('Strava 拒绝了授权（'+r.status+'），请核对 Client ID 和 Secret');
  const j=await r.json();c.tok={a:j.access_token,r:j.refresh_token,e:j.expires_at};if(j.athlete)c.athlete=j.athlete.firstname||'';save();
}
async function api(path,opt){
  const c=S.settings.strava;if(!c.tok)throw new Error('尚未连接 Strava');
  if(c.tok.e<Date.now()/1000+120)await tokenReq({grant_type:'refresh_token',refresh_token:c.tok.r});
  opt=opt||{};let r;
  try{r=await fetch(ST+'/api/v3'+path,{method:opt.method||'GET',body:opt.body,headers:{Authorization:'Bearer '+c.tok.a,...(opt.type?{'Content-Type':opt.type}:{})}})}
  catch(e){throw new Error('连不上 Strava，请检查网络')}
  if(r.status===401)throw new Error('Strava 授权已失效，请在设置里重新授权');
  if(r.status===429)throw new Error('Strava 请求太频繁，稍后再试');
  if(!r.ok)throw new Error('Strava 返回错误 '+r.status);
  return r.json();
}
async function finishAuth(code){
  try{await tokenReq({code,grant_type:'authorization_code'});ui.msg='已连接 Strava。'}catch(e){ui.msg=e.message}
  render();retryPending();
}
const localIso=t=>{const d=new Date(t);return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())+'T'+pad(d.getHours())+':'+pad(d.getMinutes())+':'+pad(d.getSeconds())+'Z'};
function pickOverlap(list,s){ // 选出与本次训练时间重叠最多的 Strava 活动
  let best=null,bo=0;
  for(const a of list||[]){const st=Date.parse(a.start_date),en=st+(a.elapsed_time||0)*1000;const o=Math.min(en,s.end)-Math.max(st,s.start);if(o>bo){bo=o;best=a}}
  return best;
}
async function syncSession(s,forceCreate){
  const mode='create',done=()=>{save();render()};
  s.strava={state:'pending',msg:'正在同步…'};render();
  try{
    const desc=logText(s);
    if(mode==='create'){
      const j=await api('/activities',{method:'POST',type:'application/x-www-form-urlencoded',body:new URLSearchParams({name:s.name,sport_type:'WeightTraining',start_date_local:localIso(s.start),elapsed_time:Math.max(1,Math.round((s.end-s.start)/1000)),description:desc})});
      s.strava={state:'done',id:j.id,msg:'已新建活动'};return done();
    }
    const list=await api('/athlete/activities?per_page=20&after='+Math.floor(s.start/1000-2700)+'&before='+Math.ceil(s.end/1000+2700));
    const hit=pickOverlap(list,s);
    if(!hit){s.strava={state:'pending',msg:'Strava 上还没有这个时间段的手表记录，打开 App 时会自动重试'};return done()}
    const d=await api('/activities/'+hit.id);
    const body={name:s.name,description:d.description&&d.description.indexOf(desc)<0?d.description+'\n\n'+desc:desc};
    await api('/activities/'+hit.id,{method:'PUT',type:'application/json',body:JSON.stringify(body)});
    s.strava={state:'done',id:hit.id,hr:d.average_heartrate||null,maxHr:d.max_heartrate||null,msg:d.average_heartrate?'已写入手表记录':'已写入，但这条活动没有心率数据'};done();
  }catch(e){s.strava={state:'error',msg:e.message};done()}
}
function retryPending(){
  if(!S.settings.strava.tok)return;
  S.sessions.filter(s=>s.strava&&s.strava.state==='pending'&&Date.now()-s.end<3*864e5).slice(0,3).forEach(s=>syncSession(s));
}

/* ---------- 事件 ---------- */
function armed(b){ // 危险操作要点两次
  if(!b.dataset.confirm||b.dataset.armed)return true;
  b.dataset.armed='1';b.dataset.label=b.textContent;b.textContent=b.dataset.confirm;
  setTimeout(()=>{if(b.isConnected){delete b.dataset.armed;b.textContent=b.dataset.label}},3000);return false;
}
function curTpl(){return ui.sheet&&S.templates.find(t=>t.id===ui.sheet.id)}
const A={
  close(){ui.sheet=null},
  'open-tpl'(b){ui.sheet={t:'tpl',id:b.dataset.id,edit:!!b.dataset.edit}},
  'tpl-edit'(){ui.sheet.edit=!ui.sheet.edit;save()},
  'tpl-new'(){const t={id:uid(),name:'新模版',items:[]};S.templates.push(t);save();ui.sheet={t:'tpl',id:t.id,edit:true}},
  'tpl-del'(){S.templates=S.templates.filter(t=>t.id!==ui.sheet.id);save();ui.sheet=null},
  'tpl-sets'(b){const it=curTpl().items[+b.dataset.i];it.sets=Math.min(12,Math.max(1,it.sets+ +b.dataset.d));save()},
  'tpl-up'(b){const a=curTpl().items,i=+b.dataset.i;if(i>0){[a[i-1],a[i]]=[a[i],a[i-1]];save()}},
  'tpl-rm'(b){curTpl().items.splice(+b.dataset.i,1);save()},
  'tpl-add'(){ui.sheet={t:'pick',id:ui.sheet.id}},
  pick(b){curTpl().items.push({exId:b.dataset.id,sets:3});save();b.textContent='已添加';return false},
  start(b){prime();startWorkout(b.dataset.id);return false},
  'open-ex'(b){ui.sheet={t:'ex',id:b.dataset.id,back:b.dataset.back}},
  'ex-new'(){ui.sheet={t:'exEdit',id:null}},
  'ex-edit'(b){ui.sheet={t:'exEdit',id:b.dataset.id}},
  'ex-noimg'(b){delete exById(b.dataset.id).img;save()},
  'ex-del'(b){const id=b.dataset.id;S.exercises=S.exercises.filter(e=>e.id!==id);S.templates.forEach(t=>t.items=t.items.filter(i=>i.exId!==id));save();ui.sheet=null},
  'ex-save'(b){saveEx(b.dataset.id);return false},
  'w-min'(){ui.wk=false},
  'w-resume'(){prime();ui.wk=true;keepAwake()},
  chk(b){prime();const it=S.active.items[+b.dataset.i],st=it.sets[+b.dataset.j];st.val=Math.max(0,+st.val||0)||it.target;st.done=true;advance();if(allDone())T=null;else startRest();save()},
  bump(b){const it=curItem(),st=it.sets.find(x=>!x.done);if(st){st.val=Math.max(1,(+st.val||0)+ +b.dataset.d);save()}},
  hold(b){prime();const i=+b.dataset.i,j=+b.dataset.j;T={kind:'hold',i,j,start:Date.now()}},
  't-stop'(){if(!T||T.kind!=='hold')return false;const st=S.active.items[T.i].sets[T.j];st.val=Math.max(1,Math.round((Date.now()-T.start)/1000));st.done=true;T=null;advance();if(!allDone())startRest();save()},
  undo(){const it=curItem();for(let k=it.sets.length-1;k>=0;k--)if(it.sets[k].done){it.sets[k].done=false;break}save()},
  'w-go'(b){const a=S.active;a.cur=Math.min(a.items.length-1,Math.max(0,a.cur+ +b.dataset.d));if(T&&T.kind==='hold')T=null;save()},
  'w-nextopen'(){const a=S.active;const k=a.items.findIndex(it=>it.sets.some(x=>!x.done));if(k>=0)a.cur=k;save()},
  'w-end'(){finishWorkout();return false},
  't-add'(){if(T&&T.kind==='rest')T.end+=15000;paintTick();return false},
  't-skip'(){T=null;paintTick();return false},
  'w-drop'(){S.active=null;T=null;ui.wk=false;save()},
  'w-finish'(){finishWorkout();return false},
  'open-session'(b){ui.sheet={t:'session',id:b.dataset.id}},
  's-del'(b){S.sessions=S.sessions.filter(s=>s.id!==b.dataset.id);save();ui.sheet=null},
  's-sync'(b){syncSession(S.sessions.find(s=>s.id===b.dataset.id));return false},
  's-create'(b){syncSession(S.sessions.find(s=>s.id===b.dataset.id),true);return false},
  rest(b){S.settings.rest=Math.min(300,Math.max(0,S.settings.rest+ +b.dataset.d));save()},
  'st-off'(){const c=S.settings.strava;c.tok=null;c.athlete='';ui.msg='已断开 Strava。';save()},
  'st-paste'(){const v=$('#st-paste').value.trim(),m=v.match(/[?&]code=([^&\s]+)/);const code=m?m[1]:(/^[0-9a-f]{20,}$/i.test(v)?v:'');if(!code){ui.msg='没有在这段文字里找到授权码，请粘贴跳转后的完整网址。';return}finishAuth(code);return false},
  backup(){ui.sheet={t:'backup'}},
  'bk-copy'(){const t=$('#bk');t.select();(navigator.clipboard?navigator.clipboard.writeText(t.value):Promise.reject()).then(()=>$('#bk-msg').textContent='已复制。',()=>$('#bk-msg').textContent='自动复制失败，请长按文本框手动全选复制。');return false},
  'bk-load'(){try{const d=JSON.parse($('#bk').value);if(!d.exercises||!d.templates||!d.sessions)throw 0;const keep=S.settings.strava;S={...seed(),...d,active:null};S.settings.strava={...S.settings.strava,clientId:keep.clientId,clientSecret:keep.clientSecret,tok:keep.tok,athlete:keep.athlete};save();ui.sheet=null}catch(e){$('#bk-msg').textContent='内容不是有效的备份，没有做任何更改。';return false}}
};
function saveEx(id){
  const name=$('#e-name').value.trim();if(!name){$('#e-name').focus();return}
  const unit=$('#e-unit').value,lines=v=>v.split('\n').map(x=>x.trim()).filter(Boolean);
  const data={name,unit,type:unit.indexOf('秒')===0?'time':'reps',target:Math.max(1,+$('#e-target').value||1),weighted:$('#e-w').checked,cues:lines($('#e-cues').value),bad:lines($('#e-bad').value)};
  let e=id&&exById(id);if(e)Object.assign(e,data);else{e={id:uid(),...data};S.exercises.push(e)}
  const f=$('#e-img').files[0],fin=()=>{if(!save()){delete e.img;save()}ui.sheet={t:'ex',id:e.id};render()};
  if(!f)return fin();
  const img=new Image(),url=URL.createObjectURL(f);
  img.onload=()=>{const k=Math.min(1,480/Math.max(img.width,img.height)),c=document.createElement('canvas');c.width=img.width*k;c.height=img.height*k;c.getContext('2d').drawImage(img,0,0,c.width,c.height);e.img=c.toDataURL('image/jpeg',.72);URL.revokeObjectURL(url);fin()};
  img.onerror=fin;img.src=url;
}
document.addEventListener('click',ev=>{
  if(ev.target.id==='sheet'){ui.sheet=null;return render()}
  const b=ev.target.closest('[data-act]');if(!b||b.disabled)return;
  if(!armed(b))return;
  if(A[b.dataset.act](b)!==false)render();
});
document.addEventListener('input',ev=>{
  const el=ev.target,f=el.dataset.f;if(!f)return;const c=S.settings.strava;
  if(f==='set'||f==='setw'){const st=S.active&&S.active.items[+el.dataset.i].sets[+el.dataset.j];if(st)st[f==='set'?'val':'w']=el.value}
  else if(f==='tpl-name'){const t=curTpl();if(t)t.name=el.value||'未命名模版'}
  else if(f==='st-id')c.clientId=el.value.trim();
  else if(f==='st-sec')c.clientSecret=el.value.trim();
  save();
});
document.addEventListener('change',ev=>{const el=ev.target;if(el.dataset.f==='mode'){S.settings.strava.mode=el.value;save()}else if(el.dataset.f==='st-id'||el.dataset.f==='st-sec')render()});
window.addEventListener('hashchange',()=>{if(ui.keep)ui.keep=false;else ui.sheet=null;render()});
document.addEventListener('visibilitychange',()=>{if(!document.hidden){keepAwake();retryPending();paintTick()}});

/* ---------- 启动 ---------- */
if((S.v||1)<2){ // 第 2 版：补上卷腹、平躺抬腿、引体向上
  const t=S.templates.find(x=>x.id==='run-strength');
  [['crunch',5],['legraise',3],['pullup',3]].forEach(([id,sets])=>{if(!exById(id))S.exercises.push(JSON.parse(JSON.stringify(SEED_EX.find(x=>x.id===id))));if(t&&!t.items.some(i=>i.exId===id))t.items.push({exId:id,sets})});
  const pu=exById('pushup');if(pu&&pu.target===12)pu.target=15;S.v=2;save();
}
function fitH(){ // iPhone 桌面图标模式下系统给的初始高度偏短，直接按屏幕高度撑满
  const st=navigator.standalone||matchMedia('(display-mode:standalone)').matches;if(!st)return;
  const a=Math.max(screen.height,screen.width),b=Math.min(screen.height,screen.width),port=matchMedia('(orientation:portrait)').matches;
  document.documentElement.style.setProperty('--H',Math.max(innerHeight,port?a:b)+'px');
}
fitH();addEventListener('resize',fitH);addEventListener('orientationchange',()=>setTimeout(fitH,300));setTimeout(()=>{fitH();try{scrollTo(0,0)}catch(e){}},300);
tick=setInterval(paintTick,250);
if(S.active)ui.wk=false;
render();
(function(){
  let q;try{q=new URLSearchParams(location.search)}catch(e){return}
  const code=q.get('code'),err=q.get('error');
  if(code||err){try{history.replaceState(null,'',location.pathname+'#prefs')}catch(e){}
    if(code)finishAuth(code);else{ui.msg='你在 Strava 取消了授权。';render()}}
  else retryPending();
})();
if('serviceWorker' in navigator&&location.protocol==='https:'){try{navigator.serviceWorker.register('sw.js').catch(()=>{})}catch(e){}}
</script>
